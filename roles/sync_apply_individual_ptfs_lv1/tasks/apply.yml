---
# Task for apply.yml
- name: Initialize
  ansible.builtin.set_fact:
    sync_apply_individual_ptfs_lv1_path: "~/PTF/singleptf/{{ not_loaded_list_var.file_path | basename }}"

- name: Compose path
  ansible.builtin.set_fact:
    sync_apply_individual_ptfs_lv1_path: "{{ sync_apply_individual_ptfs_lv1_path | regex_replace('~', sync_apply_individual_ptfs_lv1_home_dir.stdout) }}"
  when: sync_apply_individual_ptfs_lv1_path | regex_search("^~") | length > 0

- name: Debug path
  ansible.builtin.debug:
    var: sync_apply_individual_ptfs_lv1_path

- name: Apply PTF
  block:
    - name: Apply PTF using bin file
      ibm.power_ibmi.ibmi_fix_imgclg:
        src: '{{ sync_apply_individual_ptfs_lv1_path }}'
        apply_type: "*IMMDLY"
        rollback: true
      register: sync_apply_individual_ptfs_lv1_apply_result
      ignore_errors: true

    - name: Print apply result
      ansible.builtin.debug:
        var: sync_apply_individual_ptfs_lv1_apply_result

    - name: Apply failure handling
      when: sync_apply_individual_ptfs_lv1_apply_result.rc != 0
      block:
        - name: Print apply fail result
          ansible.builtin.debug:
            msg: "PTF {{ not_loaded_list_var.ptf_id }} applied fail. Please see above job log"

        - name: Compose apply fail list
          ansible.builtin.set_fact:
            sync_apply_individual_ptfs_lv1_apply_fail_list: "{{ sync_apply_individual_ptfs_lv1_apply_fail_list | default([]) + [not_loaded_list_var.ptf_id] }}"

    - name: Apply success
      when: sync_apply_individual_ptfs_lv1_apply_result.rc == 0
      block:
        - name: Print apply success result
          ansible.builtin.debug:
            msg: "PTF {{ not_loaded_list_var.ptf_id }} applied succesfully"

        - name: Debug not_loaded_list_var.ptf_id
          ansible.builtin.debug:
            var: not_loaded_list_var.ptf_id

        - name: Compose apply success list
          ansible.builtin.set_fact:
            sync_apply_individual_ptfs_lv1_apply_success_list: "{{ sync_apply_individual_ptfs_lv1_apply_success_list | default([])
                                                                   + [not_loaded_list_var.ptf_id] }}"
