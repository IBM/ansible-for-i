---
# Task for transfer.yml
- name: Initialize sync_list
  ansible.builtin.set_fact:
    sync_apply_individual_ptfs_lv1_path: ''
    sync_apply_individual_ptfs_lv1_sync_list: []
    sync_apply_individual_ptfs_lv1_sync_success_list: []

- name: Print not_loaded_list_var
  ansible.builtin.debug:
    var: not_loaded_list_var

- name: Recursively find ptf files
  ansible.builtin.find:
    paths: "{{ not_loaded_list_var.file_path }}"
    recurse: true
  delegate_to: "{{ sync_apply_individual_ptfs_lv1_src_host }}"
  register: sync_apply_individual_ptfs_lv1_find_result

- name: Print find_result
  ansible.builtin.debug:
    var: sync_apply_individual_ptfs_lv1_find_result

- name: Quit
  ansible.builtin.fail:
    msg: "ptf_dir: {{ not_loaded_list_var.file_path }} is not valid or doesn't contain any file, quit."
  when: sync_apply_individual_ptfs_lv1_find_result.matched == 0

- name: Compose target tmp dir str
  ansible.builtin.set_fact:
    sync_apply_individual_ptfs_lv1_path: "~/PTF/singleptf/{{ not_loaded_list_var.file_path | basename }}"

- name: Print path
  ansible.builtin.debug:
    var: sync_apply_individual_ptfs_lv1_path

- name: Check if the folder is already exists
  ansible.builtin.stat:
    path: "{{ sync_apply_individual_ptfs_lv1_path }}"
  register: sync_apply_individual_ptfs_lv1_stat_result
  ignore_errors: true

- name: Include check_file role to check if files are the same
  ansible.builtin.include_role:
    name: check_file
  vars:
    check_file_target_file_path: "{{ sync_apply_individual_ptfs_lv1_path }}"
    check_file_repo_file_path: "{{ not_loaded_list_var.file_path }}"
    check_file_repo_server: "{{ sync_apply_individual_ptfs_lv1_src_host }}"
  when: sync_apply_individual_ptfs_lv1_stat_result.stat.exists

- name: Transfer images
  when: >
    (check_file_same_files is defined and not check_file_same_files)
    or not sync_apply_individual_ptfs_lv1_stat_result.stat.exists
  block:
    - name: Clear receive dir
      ansible.builtin.file:
        path: "{{ sync_apply_individual_ptfs_lv1_path }}"
        state: absent
      register: sync_apply_individual_ptfs_lv1_clear_result
      ignore_errors: true

    - name: Make receive dir
      ansible.builtin.file:
        path: "{{ sync_apply_individual_ptfs_lv1_path }}"
        state: directory
        mode: '0755'
      register: sync_apply_individual_ptfs_lv1_file_result
      ignore_errors: true

    - name: Failure with receive dir
      when: sync_apply_individual_ptfs_lv1_file_result.failed == 1
      block:
        - name: Skip when make receive dir fail
          ansible.builtin.fail:
            msg: "{{ 'Make receive dir ' + sync_apply_individual_ptfs_lv1_path + ' fail, quit.' }}"

    - name: Transfer image
      block:
        - name: Compose src_list
          ansible.builtin.set_fact:
            sync_apply_individual_ptfs_lv1_src_list: >-
              {{ sync_apply_individual_ptfs_lv1_src_list | default([])
              + [{'src': find_result_files_var.path}] }}
          loop: "{{ sync_apply_individual_ptfs_lv1_find_result.files }}"
          loop_control:
            loop_var: find_result_files_var

        - name: Debug src_list
          ansible.builtin.debug:
            var: sync_apply_individual_ptfs_lv1_src_list

        - name: Transfer image to target_system
          ibm.power_ibmi.ibmi_synchronize_files:
            dest: "{{ sync_apply_individual_ptfs_lv1_path }}"
            src_list: "{{ sync_apply_individual_ptfs_lv1_src_list }}"
          delegate_to: "{{ sync_apply_individual_ptfs_lv1_src_host }}"
          register: sync_apply_individual_ptfs_lv1_sync_result

        - name: Print transfer
          ansible.builtin.debug:
            var: sync_apply_individual_ptfs_lv1_sync_result

        - name: Sync failure handling
          when: sync_apply_individual_ptfs_lv1_sync_result.fail_list != []
          block:
            - name: Delete the dest file dir
              ansible.builtin.file:
                path: "{{ sync_apply_individual_ptfs_lv1_path }}"
                state: absent
              failed_when: false
              when: sync_apply_individual_ptfs_lv1_delete

            - name: Skip when transfer failed
              ansible.builtin.fail:
                msg: "One or more ptf file transfer failed, quit."

- name: Compose
  ansible.builtin.set_fact:
    sync_apply_individual_ptfs_lv1_dest_file_path: "{{ sync_apply_individual_ptfs_lv1_dest_file_path | default([]) + [sync_apply_individual_ptfs_lv1_path] }}"

- name: Print dest_file_path
  ansible.builtin.debug:
    var: sync_apply_individual_ptfs_lv1_dest_file_path
