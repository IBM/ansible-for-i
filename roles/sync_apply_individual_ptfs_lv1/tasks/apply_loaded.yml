---
# Task for apply_loaded.yml
- name: Involve ibm.power_ibmi.ibmi_fix to apply already loaded ptfs
  ibm.power_ibmi.ibmi_fix:
    product_id: "{{ already_loaded_list_var.product }}"
    fix_list: "{{ already_loaded_list_var.ptf_id }}"
    operation: 'apply_only'
    delayed_option: '{{ sync_apply_individual_ptfs_lv1_delayed_option }}'
    temp_or_perm: '{{ sync_apply_individual_ptfs_lv1_temp_or_perm }}'
  ignore_errors: true
  register: sync_apply_individual_ptfs_lv1_ibmi_fix_result

- name: Print ibmi_fix_result
  ansible.builtin.debug:
    var: sync_apply_individual_ptfs_lv1_ibmi_fix_result

- name: Compose apply success list
  ansible.builtin.set_fact:
    sync_apply_individual_ptfs_lv1_apply_loaded_success_list: >-
      {{ sync_apply_individual_ptfs_lv1_apply_loaded_success_list | default([]) + [already_loaded_list_var.ptf_id] }}
  when: sync_apply_individual_ptfs_lv1_ibmi_fix_result.rc == 0

- name: Compose apply fail list
  ansible.builtin.set_fact:
    sync_apply_individual_ptfs_lv1_apply_loaded_fail_list: >-
      {{ sync_apply_individual_ptfs_lv1_apply_loaded_fail_list | default([]) + [already_loaded_list_var.ptf_id] }}
  when: sync_apply_individual_ptfs_lv1_ibmi_fix_result.rc != 0
