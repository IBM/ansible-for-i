---
# Role for sync_apply_ptf_group_networkinstall
# This role will setup network install env on repo server and use network install mechanism to install the PTF group on target system.
- name: Setup network install repo server env
  ibm.power_ibmi.ibmi_fix_network_install_server:
    operation: 'setup_only'
    rollback: true
  delegate_to: "{{ sync_apply_ptf_group_networkinstall_src_host }}"
  register: sync_apply_ptf_group_networkinstall_server_setuponly_result

- name: Print network_install_server_setuponly_result
  ansible.builtin.debug:
    var: sync_apply_ptf_group_networkinstall_server_setuponly_result

- name: Add image files to network install env
  ibm.power_ibmi.ibmi_fix_network_install_server:
    operation: 'rmvimgclge_and_addimgclge'
    rollback: true
    virtual_image_name_list:
      - "{{ sync_apply_ptf_group_networkinstall_ptf_group_info.file_path + '/*ALL' }}"
  delegate_to: "{{ sync_apply_ptf_group_networkinstall_src_host }}"
  register: sync_apply_ptf_group_networkinstall_server_rmadd_result

- name: Print network_install_server_rmadd_result
  ansible.builtin.debug:
    var: sync_apply_ptf_group_networkinstall_server_rmadd_result

- name: Set return value for sync_apply_ptf_group_networkinstall_server_result
  ansible.builtin.set_fact:
    sync_apply_ptf_group_networkinstall_server_result: "{{ sync_apply_ptf_group_networkinstall_server_rmadd_result }}"

- name: Using network install mechanism to install the PTF group on target system
  ibm.power_ibmi.ibmi_fix_network_install_client:
    operation: 'setup_and_installPTF_and_uninstall'
    server_address: "{{ hostvars[sync_apply_ptf_group_networkinstall_src_host]['ansible_ssh_host'] }}"
    fix_omit_list: '{{ sync_apply_ptf_group_networkinstall_ptf_omit_list | default([]) }}'
    rollback: true
  register: sync_apply_ptf_group_networkinstall_client_result
  ignore_errors: true

- name: Print sync_apply_ptf_group_networkinstall_client_result
  ansible.builtin.debug:
    var: sync_apply_ptf_group_networkinstall_client_result

- name: Failure handling
  when: sync_apply_ptf_group_networkinstall_client_result.rc != 0
  block:
    - name: Debug msg
      ansible.builtin.fail:
        msg: "Failed to insgtall PTF group, see previous joblog for details."
