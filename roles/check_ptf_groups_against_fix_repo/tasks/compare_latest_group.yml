---
- name: Initialize the result list
  ansible.builtin.set_fact:
    check_ptf_groups_against_fix_repo_fix_list: []
    check_ptf_groups_against_fix_repo_ptfs_on_system: {}
    check_ptf_groups_against_fix_repo_product_list: []
    check_ptf_groups_against_fix_repo_ptf_not_installed: []

- name: Compose the PTF number list
  ansible.builtin.set_fact:
    check_ptf_groups_against_fix_repo_fix_list: "{{ check_ptf_groups_against_fix_repo_fix_list | default([]) + [ptf_info.ptf_id] }}"
  with_list: "{{ group.ptf_list }}"
  loop_control:
    loop_var: ptf_info

- name: Query PTF group information from target system
  ibm.power_ibmi.ibmi_sql_query:
    sql: "SELECT PTF_GROUP_NAME,PTF_GROUP_DESCRIPTION,PTF_GROUP_LEVEL,PTF_GROUP_STATUS FROM
      QSYS2.GROUP_PTF_INFO WHERE PTF_GROUP_NAME = '{{ group.ptf_group_number }}' ORDER BY PTF_GROUP_LEVEL DESC LIMIT 1"
  register: check_ptf_groups_against_fix_repo_result

- name: PTF group does not exist
  ansible.builtin.set_fact:
    check_ptf_groups_against_fix_repo_group_status: "{{ check_ptf_groups_against_fix_repo_group_status | default([]) +
      [{'PTF_GROUP_NUMBER': group.ptf_group_number, 'PTF_GROUP_STATUS': 'NON-EXISTENT'}] }}"
  when: check_ptf_groups_against_fix_repo_result.row | length == 0

- name: PTF group level does not match
  ansible.builtin.set_fact:
    check_ptf_groups_against_fix_repo_group_status: "{{ check_ptf_groups_against_fix_repo_group_status | default([]) +
      [{'PTF_GROUP_NUMBER': group.ptf_group_number,
        'CURRENT_GROUP_LEVEL': check_ptf_groups_against_fix_repo_result.row[0]['PTF_GROUP_LEVEL'], 'LATEST_GROUP_LEVEL': group.ptf_group_level,
        'PTF_GROUP_STATUS': check_ptf_groups_against_fix_repo_result.row[0]['PTF_GROUP_STATUS']}] }}"
  when:
    - check_ptf_groups_against_fix_repo_result.row | length > 0
    - check_ptf_groups_against_fix_repo_result.row[0]['PTF_GROUP_LEVEL'] != group.ptf_group_level

- name: PTF group level is latest, however status is not INSTALLED
  block:
    - name: Query PTF list from target system
      ibm.power_ibmi.ibmi_fix:
        operation: 'query'
        fix_list: "{{ check_ptf_groups_against_fix_repo_fix_list }}"
      register: check_ptf_groups_against_fix_repo_ptf_info

    - name: Compose PTF list on targret system
      ansible.builtin.set_fact:
        check_ptf_groups_against_fix_repo_ptfs_on_system: >-
          {{ check_ptf_groups_against_fix_repo_ptfs_on_system | default({})
          | combine({ptf.PTF_IDENTIFIER: ptf.PTF_LOADED_STATUS}) }}
      with_list: "{{ check_ptf_groups_against_fix_repo_ptf_info.ptf_list }}"
      loop_control:
        loop_var: ptf

    - name: Query product information from target system
      ibm.power_ibmi.ibmi_sql_query:
        sql: "SELECT DISTINCT PRODUCT_ID FROM QSYS2.LICENSE_INFO"
      register: check_ptf_groups_against_fix_repo_product_result

    - name: Compose product list
      ansible.builtin.set_fact:
        check_ptf_groups_against_fix_repo_product_list: >-
          {{ check_ptf_groups_against_fix_repo_product_list | default([]) + [record.PRODUCT_ID] }}
      with_list: "{{ check_ptf_groups_against_fix_repo_product_result.row }}"
      loop_control:
        loop_var: record

    - name: PTF does not exist
      ansible.builtin.set_fact:
        check_ptf_groups_against_fix_repo_ptf_not_installed: >-
          {{ check_ptf_groups_against_fix_repo_ptf_not_installed | default([])
          + [{'PTF_IDENTIFIER': ptf.ptf_id, 'PTF_LOADED_STATUS': 'NON-EXISTENT'}] }}
      when:
        - not check_ptf_groups_against_fix_repo_ptfs_on_system.get(ptf.ptf_id)
        - ptf.product in check_ptf_groups_against_fix_repo_product_list
      with_list: "{{ group.ptf_list }}"
      loop_control:
        loop_var: ptf

    - name: PTF exists but status is not APPLIED, PERMANENTLY APPLIED or SUPERSEDED
      ansible.builtin.set_fact:
        check_ptf_groups_against_fix_repo_ptf_not_installed: >-
          {{ check_ptf_groups_against_fix_repo_ptf_not_installed | default([])
          + [{'PTF_IDENTIFIER': ptf.PTF_IDENTIFIER, 'PTF_LOADED_STATUS': ptf.PTF_LOADED_STATUS}] }}
      when:
        - ptf.PTF_LOADED_STATUS != "APPLIED"
        - ptf.PTF_LOADED_STATUS != "PERMANENTLY APPLIED"
        - ptf.PTF_LOADED_STATUS != "SUPERSEDED"
        # There is an bug in 7.3 and before, but sqlservice won't change this in the future.
        - ptf.PTF_LOADED_STATUS != "SUPERCEDED"
      with_list: "{{ check_ptf_groups_against_fix_repo_ptf_info.ptf_list }}"
      loop_control:
        loop_var: ptf

    - name: Compose group_status
      ansible.builtin.set_fact:
        check_ptf_groups_against_fix_repo_group_status: >-
          {{ check_ptf_groups_against_fix_repo_group_status | default([])
          + [{'PTF_GROUP_NUMBER': group.ptf_group_number,
          'CURRENT_PTF_GROUP_LEVEL': check_ptf_groups_against_fix_repo_result.row[0]['PTF_GROUP_LEVEL'],
          'LATEST_PTF_GROUP_LEVEL': group.ptf_group_level,
          'PTF_GROUP_STATUS': check_ptf_groups_against_fix_repo_result.row[0]['PTF_GROUP_STATUS'],
          'PTF_NOT_INSTALLED': check_ptf_groups_against_fix_repo_ptf_not_installed}] }}
      when:
        - check_ptf_groups_against_fix_repo_result.row | length > 0
        - check_ptf_groups_against_fix_repo_result.row[0]['PTF_GROUP_LEVEL'] | int == group.ptf_group_level
        - check_ptf_groups_against_fix_repo_result.row[0]['PTF_GROUP_STATUS'] != "INSTALLED"

- name: PTF group is installed
  ansible.builtin.set_fact:
    check_ptf_groups_against_fix_repo_group_status: "{{ check_ptf_groups_against_fix_repo_group_status | default([]) +
      [{'PTF_GROUP_NUMBER': group.ptf_group_number,
      'CURRENT_PTF_GROUP_LEVEL': check_ptf_groups_against_fix_repo_result.row[0]['PTF_GROUP_LEVEL'], 'LATEST_PTF_GROUP_LEVEL': group.ptf_group_level,
      'PTF_GROUP_STATUS': check_ptf_groups_against_fix_repo_result.row[0]['PTF_GROUP_STATUS']}] }}"
  when:
    - check_ptf_groups_against_fix_repo_result.row | length > 0
    - check_ptf_groups_against_fix_repo_result.row[0]['PTF_GROUP_LEVEL'] | int == group.ptf_group_level
    - check_ptf_groups_against_fix_repo_result.row[0]['PTF_GROUP_STATUS'] == "INSTALLED"
