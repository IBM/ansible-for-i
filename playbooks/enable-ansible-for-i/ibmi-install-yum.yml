---

# Step 1: Download bootstrap files directly to IBM i

# Note: We use ansible.builtin.get_url to allow downloading the files before yum is installed

- name: Download bootstrap.sh directly to IBM i
  ansible.builtin.get_url:
    url: https://public.dhe.ibm.com/software/ibmi/products/pase/rpms/bootstrap.sh
    dest: /tmp/bootstrap.sh
    mode: '0755'

- name: Download bootstrap.tar.Z directly to IBM i
  ansible.builtin.get_url:
    url: https://public.dhe.ibm.com/software/ibmi/products/pase/rpms/bootstrap.tar.Z
    dest: /tmp/bootstrap.tar.Z
    mode: '0644'


# Step 2: Run bootstrap script on IBM i

- name: Run bootstrap script to install yum
  ansible.builtin.raw: |
    cd /tmp && /QOpenSys/usr/bin/ksh bootstrap.sh
  args:
    executable: /qopensys/usr/bin/qsh
  register: bootstrap_output
  failed_when: >
    bootstrap_output.rc != 0 and
    "already been bootstrapped" not in bootstrap_output.stdout
  changed_when: true


# Step 3: Verify yum installation

- name: Check if yum was installed successfully
  ansible.builtin.raw: ls -l /QOpensys/pkgs/bin/yum
  args:
    executable: /qopensys/usr/bin/qsh
  register: output_of_yum
  failed_when: "'No such' in output_of_yum.stdout"
  changed_when: false


# Step 4: Mark yum as installed

- name: Note that yum is installed
  ansible.builtin.set_fact:
    yum_installed: true
