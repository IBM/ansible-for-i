---
- name: Playbook to manage object authorities
  hosts: "{{ target_system | default('all') }}"
  gather_facts: false

  vars:
    become_user_name: null
    become_user_password: null

  tasks:
    - name: Display the authority of QGPL
      ibm.power_ibmi.ibmi_object_authority:
        operation: display
        object_name: QGPL
        object_library: QSYS
        object_type: '*LIB'
      register: obj_auth_info

    - name: Display the object authority list
      ansible.builtin.debug:
        msg: "object_authority_list: {{ obj_auth_info.object_authority_list }}"
      when: obj_auth_info.rc == 0
