# Tests are designed to use PTFs that have one prereq
- block:
    - set_fact:
        dist_ptf: {'SI86119':'5733SC1'}
        pre_ptf_74: {'SJ02601':'5770DG1'}
        pre_ptf_73: {'SI71962':'5770DG1'}
        pre_ptf_72: {'SI71969':'5770DG1'}
        remote_lib: 'FIXLIB'

    - set_fact:
        pre_ptf: "{{ lookup('vars', 'pre_ptf_' + ansible_distribution_version + ansible_distribution_release) }}"

    - ibmi_cl_command:
        cmd: 'CRTLIB LIB({{remote_lib}})'

    - name: transfer save files to remote, load fix and display fix
      ansible.builtin.include_tasks: display_fix_with_pre.yml
      with_items: 
        - '{{pre_ptf.keys() | list}}'      

    - name: transfer save files to remote, load fix and display fix
      ansible.builtin.include_tasks: display_fix_with_dist.yml
      with_items: 
        - '{{dist_ptf.keys() | list}}'    

  always:
      - ibmi_cl_command:
          cmd: 'DLTLIB LIB({{remote_lib}})'
