---
# Integration tests for the ibmi_host_server_service module
# (c) 2020, zhuljbj <zhuljbj@cn.ibm.com>
# GNU General Public License v3 or later (see COPYING or https://www.gnu.org/licenses/gpl-3.0.txt )
#
# Execute/skip list usage:
#   tc_execute: optional list of TC IDs to run  (e.g. ['TC01','TC03']) — only those TCs run.
#               The setup block always runs regardless of this list.
#   tc_skip:    optional list of TC IDs to skip (e.g. ['TC07']) — everything else runs.
#   If neither variable is defined, all TCs run (default behaviour).
#
# TC dependency notes:
#   Setup  Ensures *DTAQ is stopped before tests begin.  Always runs.
#   TC01   Start *DTAQ (started → running).  Leaves *DTAQ running.
#   TC02   Start *DTAQ when already running (idempotent).  Requires TC01.  Leaves *DTAQ running.
#   TC03   Stop *DTAQ (running → stopped).  Requires TC02.  Leaves *DTAQ stopped.
#   TC04   Stop *DTAQ when already stopped (idempotent).  Requires TC03.  Leaves *DTAQ stopped.
#   TC05   Start *ALL with extra_parameters.  Independent state-wise.  Leaves *ALL running.
#   TC06   Stop *ALL with extra_parameters.  Requires TC05.  Leaves *ALL stopped.
#   TC07   Start *DTAQ *DATABASE together.  Independent.  Leaves both running.
#   TC08   Stop *DTAQ *DATABASE together.  Requires TC07.  Leaves both stopped.
#   TC09   Negative — missing name_list (started).  No server state change.
#   TC10   Negative — missing name_list (stopped).  No server state change.
#   TC11   Negative — missing state.  No server state change.
#   TC12   Negative — all parameters missing.  No server state change.
#   TC13   Negative — unsupported parameter abc.  No server state change.
#   TC14   Negative — invalid server type name.  No server state change.
#   TC15   Negative — invalid extra_parameters.  No server state change.
#   TC16   Negative — invalid joblog value.  No server state change.
#
# The outer block/always wraps everything so the cleanup at the bottom always
# fires — it restores all host servers to running.
#

- block:

  # ─── Setup (always runs) ─────────────────────────────────────────────────────
  - name: Setup - check whether the host server DTAQ is running
    ibmi_sql_query:
      sql: "SELECT *
                FROM TABLE(QSYS2.ACTIVE_JOB_INFO(
                JOB_NAME_FILTER => 'QZHQSRVD',
                SUBSYSTEM_LIST_FILTER => 'QSYSWRK')) X"
    register: sql_result

  - name: Setup - end *DTAQ host server if it is currently running (ensure known start state)
    ibmi_cl_command:
      cmd: 'ENDHOSTSVR SERVER(*DTAQ)'
    when: sql_result.row | length != 0

  # ─── TC01 - Start *DTAQ (happy path, all parameters) ─────────────────────────
  - name: TC01 - start *DTAQ host server with all parameters
    when: (tc_execute is not defined or 'TC01' in tc_execute) and 'TC01' not in (tc_skip | default([]))
    block:
      - name: TC01 - start host server
        ibmi_host_server_service:
          name_list: ['*DTAQ']
          state: 'started'
          extra_parameters: ''
          joblog: false
        register: start_result

      - name: TC01 - assert returned fields
        assert:
          that:
            - start_result.job_log is defined
            - start_result.start is defined
            - start_result.end is defined
            - start_result.delta is defined
            - start_result.stdout is defined
            - start_result.stderr is defined
            - "'STRHOSTSVR SERVER(*DTAQ)' in start_result.cmd"
            - start_result.rc == 0
            - start_result.stdout_lines is defined
            - start_result.stderr_lines is defined

      - name: TC01 - assert *DTAQ is now running
        ibmi_sql_query:
          sql: "SELECT *
                    FROM TABLE(QSYS2.ACTIVE_JOB_INFO(
                    JOB_NAME_FILTER => 'QZHQSRVD',
                    SUBSYSTEM_LIST_FILTER => 'QSYSWRK')) X"
          expected_row_count: 1

  # ─── TC02 - Start *DTAQ when already running (idempotent) ────────────────────
  - name: TC02 - start *DTAQ host server when already running
    when: (tc_execute is not defined or 'TC02' in tc_execute) and 'TC02' not in (tc_skip | default([]))
    block:
      - name: TC02 - start host server (already running)
        ibmi_host_server_service:
          name_list: ['*DTAQ']
          state: 'started'
          extra_parameters: ''
          joblog: false
        register: start_result

      - name: TC02 - assert *DTAQ is still running
        ibmi_sql_query:
          sql: "SELECT *
                    FROM TABLE(QSYS2.ACTIVE_JOB_INFO(
                    JOB_NAME_FILTER => 'QZHQSRVD',
                    SUBSYSTEM_LIST_FILTER => 'QSYSWRK')) X"
          expected_row_count: 1

  # ─── TC03 - Stop *DTAQ (happy path, all parameters) ──────────────────────────
  - name: TC03 - stop *DTAQ host server with all parameters
    when: (tc_execute is not defined or 'TC03' in tc_execute) and 'TC03' not in (tc_skip | default([]))
    block:
      - name: TC03 - stop host server
        ibmi_host_server_service:
          name_list: ['*DTAQ']
          state: 'stopped'
          extra_parameters: ''
          joblog: true
        register: end_result

      - name: TC03 - assert returned fields
        assert:
          that:
            - end_result.job_log is defined
            - end_result.start is defined
            - end_result.end is defined
            - end_result.delta is defined
            - end_result.stdout is defined
            - end_result.stderr is defined
            - "'ENDHOSTSVR SERVER(*DTAQ) ' in end_result.cmd"
            - end_result.rc == 0
            - end_result.stdout_lines is defined
            - end_result.stderr_lines is defined

      - name: TC03 - assert *DTAQ is now stopped
        ibmi_sql_query:
          sql: "SELECT *
                    FROM TABLE(QSYS2.ACTIVE_JOB_INFO(
                    JOB_NAME_FILTER => 'QZHQSRVD',
                    SUBSYSTEM_LIST_FILTER => 'QSYSWRK')) X"
          expected_row_count: 0

  # ─── TC04 - Stop *DTAQ when already stopped (idempotent) ─────────────────────
  - name: TC04 - stop *DTAQ host server when already stopped
    when: (tc_execute is not defined or 'TC04' in tc_execute) and 'TC04' not in (tc_skip | default([]))
    block:
      - name: TC04 - stop host server (already stopped)
        ibmi_host_server_service:
          name_list: ['*DTAQ']
          state: 'stopped'
          extra_parameters: ''
          joblog: true
        register: end_result

      - name: TC04 - assert *DTAQ is still stopped
        ibmi_sql_query:
          sql: "SELECT *
                    FROM TABLE(QSYS2.ACTIVE_JOB_INFO(
                    JOB_NAME_FILTER => 'QZHQSRVD',
                    SUBSYSTEM_LIST_FILTER => 'QSYSWRK')) X"
          expected_row_count: 0

  # ─── TC05 - Start *ALL with extra_parameters ─────────────────────────────────
  - name: TC05 - start *ALL host servers with extra_parameters
    when: (tc_execute is not defined or 'TC05' in tc_execute) and 'TC05' not in (tc_skip | default([]))
    block:
      - name: TC05 - start all host servers with RQDPCL(*TCP)
        ibmi_host_server_service:
          name_list: ['*ALL']
          state: 'started'
          extra_parameters: 'RQDPCL(*TCP)'
          joblog: false
        register: start_result

      - name: TC05 - assert cmd contains extra_parameters
        assert:
          that:
            - start_result.cmd == 'QSYS/STRHOSTSVR SERVER(*ALL) RQDPCL(*TCP)'

  # ─── TC06 - Stop *ALL with extra_parameters ──────────────────────────────────
  - name: TC06 - stop *ALL host servers with extra_parameters
    when: (tc_execute is not defined or 'TC06' in tc_execute) and 'TC06' not in (tc_skip | default([]))
    block:
      - name: TC06 - stop all host servers with ENDACTCNN
        ibmi_host_server_service:
          name_list: ['*ALL']
          state: 'stopped'
          extra_parameters: 'ENDACTCNN(*FILE *DATABASE)'
          joblog: true
        register: end_result

      - name: TC06 - assert cmd contains extra_parameters
        assert:
          that:
            - end_result.cmd == 'QSYS/ENDHOSTSVR SERVER(*ALL) ENDACTCNN(*FILE *DATABASE)'

  # ─── TC07 - Start multiple host servers ──────────────────────────────────────
  - name: TC07 - start *DTAQ and *DATABASE together
    when: (tc_execute is not defined or 'TC07' in tc_execute) and 'TC07' not in (tc_skip | default([]))
    block:
      - name: TC07 - start multiple host servers
        ibmi_host_server_service:
          name_list: ["*DTAQ", "*DATABASE"]
          state: 'started'
          joblog: true
        register: start_result

      - name: TC07 - assert cmd lists both servers
        assert:
          that:
            - start_result.cmd == 'QSYS/STRHOSTSVR SERVER(*DTAQ *DATABASE)  '

  # ─── TC08 - Stop multiple host servers ───────────────────────────────────────
  - name: TC08 - stop *DTAQ and *DATABASE together
    when: (tc_execute is not defined or 'TC08' in tc_execute) and 'TC08' not in (tc_skip | default([]))
    block:
      - name: TC08 - stop multiple host servers
        ibmi_host_server_service:
          name_list: ["*DTAQ", "*DATABASE"]
          state: 'stopped'
          joblog: true
        register: end_result

      - name: TC08 - assert cmd lists both servers
        assert:
          that:
            - end_result.cmd == 'QSYS/ENDHOSTSVR SERVER(*DTAQ *DATABASE)  '

  # ─── TC09 - Negative: missing name_list (state=started) ──────────────────────
  - name: TC09 - negative - start without name_list
    when: (tc_execute is not defined or 'TC09' in tc_execute) and 'TC09' not in (tc_skip | default([]))
    block:
      - name: TC09 - start host server with only state parameter
        ibmi_host_server_service:
          state: started
        register: neg_result
        failed_when: "'missing required argument' not in neg_result.msg"

  # ─── TC10 - Negative: missing name_list (state=stopped) ──────────────────────
  - name: TC10 - negative - stop without name_list
    when: (tc_execute is not defined or 'TC10' in tc_execute) and 'TC10' not in (tc_skip | default([]))
    block:
      - name: TC10 - stop host server with only state parameter
        ibmi_host_server_service:
          state: stopped
        register: neg_result
        failed_when: "'missing required argument' not in neg_result.msg"

  # ─── TC11 - Negative: missing state ──────────────────────────────────────────
  - name: TC11 - negative - provide name_list without state
    when: (tc_execute is not defined or 'TC11' in tc_execute) and 'TC11' not in (tc_skip | default([]))
    block:
      - name: TC11 - call module without state
        ibmi_host_server_service:
          name_list: ["*DTAQ", "*DATABASE"]
        register: neg_result
        failed_when: "'missing required argument' not in neg_result.msg"

  # ─── TC12 - Negative: all parameters missing ─────────────────────────────────
  - name: TC12 - negative - call module with no parameters at all
    when: (tc_execute is not defined or 'TC12' in tc_execute) and 'TC12' not in (tc_skip | default([]))
    block:
      - name: TC12 - call module with no parameters
        ibmi_host_server_service:
        register: neg_result
        failed_when: "'missing required argument' not in neg_result.msg"

  # ─── TC13 - Negative: unsupported parameter ───────────────────────────────────
  - name: TC13 - negative - unsupported parameter abc
    when: (tc_execute is not defined or 'TC13' in tc_execute) and 'TC13' not in (tc_skip | default([]))
    block:
      - name: TC13 - call module with unsupported parameter
        ibmi_host_server_service:
          name_list: ["*DTAQ", "*DATABASE"]
          state: 'stopped'
          abc: true
        register: neg_result
        failed_when: "'Unsupported parameters' not in neg_result.msg"

  # ─── TC14 - Negative: invalid server type ─────────────────────────────────────
  - name: TC14 - negative - invalid server type in name_list
    when: (tc_execute is not defined or 'TC14' in tc_execute) and 'TC14' not in (tc_skip | default([]))
    block:
      - name: TC14 - call module with invalid server type
        ibmi_host_server_service:
          name_list: ["abc"]
          state: 'stopped'
        register: neg_result
        failed_when: "'Value specified for name_list is not valid' not in neg_result.msg"

  # ─── TC15 - Negative: invalid extra_parameters ────────────────────────────────
  - name: TC15 - negative - invalid extra_parameters value
    when: (tc_execute is not defined or 'TC15' in tc_execute) and 'TC15' not in (tc_skip | default([]))
    block:
      - name: TC15 - call module with invalid extra_parameters
        ibmi_host_server_service:
          name_list: ["*ALL"]
          state: 'stopped'
          extra_parameters: 'abc abc'
          joblog: true
        register: neg_result
        failed_when: "neg_result.rc == 0"

  # ─── TC16 - Negative: invalid joblog value ────────────────────────────────────
  - name: TC16 - negative - invalid joblog value
    when: (tc_execute is not defined or 'TC16' in tc_execute) and 'TC16' not in (tc_skip | default([]))
    block:
      - name: TC16 - call module with non-boolean joblog
        ibmi_host_server_service:
          name_list: ["*ALL"]
          state: 'stopped'
          joblog: 'abcabc'
        register: neg_result
        failed_when: "'we were unable to convert to bool' not in neg_result.msg"

  always:
    - name: Restore host servers to running state
      ibmi_host_server_service:
        name_list: ['*ALL']
        state: 'started'
      ignore_errors: true
