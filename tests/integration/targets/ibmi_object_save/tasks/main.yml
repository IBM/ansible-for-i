# Test scope
#   save_object.yml  TC01–TC21  Core save/restore tests (no iASP dependency)
#   iasp.yml         TC22–TC31  iASP save/restore tests (skipped if no iASP available)
#
# Execute/skip list usage:
#   tc_execute: optional list of TC IDs to run  (e.g. ['TC01','TC08']) — only those TCs run.
#   tc_skip:    optional list of TC IDs to skip — everything else runs.
#   If neither variable is defined, all TCs run (default behaviour).
#
# TC dependency notes:
#   TC01  Creates SAVTEST in ARCHLIB — TC02–TC08 rely on it existing (use force_save or a fresh file).
#   TC22  Restores seed objects to iASP SAVRST — TC23–TC31 rely on those objects.
#   TC27  Deletes and recreates iASP SAVRST inline — must run after TC26.

- block:
    - name: Copy seed save file to /tmp
      copy: src="IBMISAVF.FILE" dest="/tmp/"

    - ansible.builtin.include_tasks: save_object.yml

    - ansible.builtin.include_tasks: iasp.yml

  always:
    - name: Cleanup - remove copied seed file from /tmp
      command: 'rm -rf /tmp/IBMISAVF.FILE'
