# iasp.yml — iASP test cases for ibmi_object_save
#
# TC IDs: TC22–TC31
# These tests only run when at least one iASP is AVAILABLE on the system
# (the outer when: iasp_list.row_count != 0 guard on the block handles this).
#
# Execute/skip list usage (inherited from main.yml):
#   tc_execute: optional list — only listed TCs run.
#   tc_skip:    optional list — everything else runs.
#   If neither is defined, all TCs run.

- name: Query available iASPs
  ibmi_sql_query:
    sql: "SELECT * FROM QSYS2.ASP_INFO where ASP_STATE = 'AVAILABLE' and ASP_NUMBER != 1"
  register: iasp_list

- block:
    # ── Setup: create iASP and sysbase libraries ──────────────────────────────
    - name: Setup - copy save file for iASP tests
      copy: src="IBMISAVF.FILE" dest="/tmp/"

    - name: Setup - create iASP libraries SAVRST and TEMPLIB
      ibmi_cl_command:
        cmd: CRTLIB LIB({{item}}) ASP(*ASPDEV) ASPDEV({{iasp_list.row[0]['DEVICE_DESCRIPTION_NAME']}})
        asp_group: "{{iasp_list.row[0]['DEVICE_DESCRIPTION_NAME']}}"
        joblog: true
      with_items:
        - SAVRST
        - TEMPLIB

    - name: Setup - create sysbase libraries ARCHLIB and SAVRST1
      ibmi_cl_command:
        cmd: CRTLIB LIB({{item}})
        joblog: true
      with_items:
        - ARCHLIB
        - SAVRST1

    - name: Setup - copy save file to ARCHLIB
      command: 'mv /tmp/IBMISAVF.FILE /QSYS.LIB/ARCHLIB.LIB/'

    # ── TC22 - Restore from sysbase to iASP library ───────────────────────────
    - name: TC22 - restore objects from sysbase lib to iASP library
      when: (tc_execute is not defined or 'TC22' in tc_execute) and 'TC22' not in (tc_skip | default([]))
      block:
        - name: TC22 - restore seed objects into iASP SAVRST
          ibmi_object_restore:
            object_lib: 'SAVRST'
            savefile_name: 'IBMISAVF'
            savefile_lib: 'ARCHLIB'
            parameters: "RSTASPDEV({{iasp_list.row[0]['DEVICE_DESCRIPTION_NAME']}})"
            asp_group: "{{iasp_list.row[0]['DEVICE_DESCRIPTION_NAME']}}"
          register: rstobj_result
          failed_when: "rstobj_result.rc != 0 and rstobj_result.job_log | selectattr('MESSAGE_ID', 'equalto', 'CPF3848') | map(attribute='MESSAGE_ID') | list | length ==0"

        - name: TC22 - verify all objects have been restored
          ibmi_sql_query:
            sql: "SELECT OBJNAME, OBJTYPE FROM TABLE (QSYS2.OBJECT_STATISTICS('SAVRST', '*ALL') ) AS X"
            database: "{{iasp_list.row[0]['DEVICE_DESCRIPTION_NAME']}}"
          register: sql_query_result

    # ── TC23 - Save from iASP lib with joblog ─────────────────────────────────
    - name: TC23 - save objects from iASP lib with joblog enabled
      when: (tc_execute is not defined or 'TC23' in tc_execute) and 'TC23' not in (tc_skip | default([]))
      block:
        - name: TC23 - save iASP SAVRST to iASP TEMPLIB (joblog=true)
          ibmi_object_save:
            object_lib: 'SAVRST'
            savefile_name: 'SAVTEST1'
            savefile_lib: 'TEMPLIB'
            asp_group: "{{iasp_list.row[0]['DEVICE_DESCRIPTION_NAME']}}"
            joblog: true
          register: savobj_result

    # ── TC24 - Save from iASP lib (assert return values) ─────────────────────
    - name: TC24 - save objects from iASP lib and assert return values
      when: (tc_execute is not defined or 'TC24' in tc_execute) and 'TC24' not in (tc_skip | default([]))
      block:
        - name: TC24 - save iASP SAVRST to iASP TEMPLIB
          ibmi_object_save:
            object_lib: 'SAVRST'
            savefile_name: 'SAVTEST'
            savefile_lib: 'TEMPLIB'
            asp_group: "{{iasp_list.row[0]['DEVICE_DESCRIPTION_NAME']}}"
          register: savobj_result

        - name: TC24 - assert returned values
          assert:
            that:
              - savobj_result.start != ''
              - savobj_result.end != ''
              - savobj_result.delta != ''
              - savobj_result.rc == 0
              - savobj_result.stdout != ''
              - savobj_result.stdout_lines != ''

    # ── TC25 - Restore from iASP save back to iASP ───────────────────────────
    - name: TC25 - restore objects from iASP save back to iASP library
      when: (tc_execute is not defined or 'TC25' in tc_execute) and 'TC25' not in (tc_skip | default([]))
      block:
        - name: TC25 - restore SAVTEST1 back to iASP SAVRST
          ibmi_object_restore:
            object_lib: 'SAVRST'
            savefile_name: 'SAVTEST1'
            savefile_lib: 'TEMPLIB'
            asp_group: "{{iasp_list.row[0]['DEVICE_DESCRIPTION_NAME']}}"
            parameters: "RSTASPDEV({{iasp_list.row[0]['DEVICE_DESCRIPTION_NAME']}})"

    # ── TC26 - Save from iASP lib to sysbase lib ─────────────────────────────
    - name: TC26 - save objects from iASP lib to sysbase lib
      when: (tc_execute is not defined or 'TC26' in tc_execute) and 'TC26' not in (tc_skip | default([]))
      block:
        - name: TC26 - save iASP SAVRST to sysbase SAVRST1
          ibmi_object_save:
            object_lib: 'SAVRST'
            savefile_name: 'SAVTEST'
            savefile_lib: 'SAVRST1'
            asp_group: "{{iasp_list.row[0]['DEVICE_DESCRIPTION_NAME']}}"
            joblog: true
          register: savobj_result

    # ── TC27 - Restore from sysbase lib to iASP lib ───────────────────────────
    - name: TC27 - restore objects from sysbase savefile to iASP lib
      when: (tc_execute is not defined or 'TC27' in tc_execute) and 'TC27' not in (tc_skip | default([]))
      block:
        - name: TC27 - delete iASP SAVRST to prepare for restore
          ibmi_cl_command:
            cmd: "dltlib lib(SAVRST)"
            joblog: 'true'
            asp_group: "{{iasp_list.row[0]['DEVICE_DESCRIPTION_NAME']}}"

        - name: TC27 - recreate iASP SAVRST
          ibmi_cl_command:
            cmd: CRTLIB LIB(SAVRST) ASP(*ASPDEV) ASPDEV({{iasp_list.row[0]['DEVICE_DESCRIPTION_NAME']}})
            asp_group: "{{iasp_list.row[0]['DEVICE_DESCRIPTION_NAME']}}"

        - name: TC27 - restore from sysbase SAVRST1 to iASP SAVRST
          ibmi_object_restore:
            object_lib: 'SAVRST'
            savefile_name: 'SAVTEST'
            savefile_lib: 'SAVRST1'
            asp_group: "{{iasp_list.row[0]['DEVICE_DESCRIPTION_NAME']}}"
            parameters: "RSTASPDEV({{iasp_list.row[0]['DEVICE_DESCRIPTION_NAME']}})"
            joblog: true

        - name: TC27 - verify all objects have been restored to iASP
          ibmi_sql_query:
            sql: "SELECT OBJNAME, OBJTYPE FROM TABLE (QSYS2.OBJECT_STATISTICS('SAVRST', '*ALL') ) AS X"
            database: "{{iasp_list.row[0]['DEVICE_DESCRIPTION_NAME']}}"
            expected_row_count: 6
          register: sql_query_result

    # ── TC28 - Save from sysbase lib to iASP lib ─────────────────────────────
    - name: TC28 - save objects from sysbase lib to iASP lib
      when: (tc_execute is not defined or 'TC28' in tc_execute) and 'TC28' not in (tc_skip | default([]))
      block:
        - name: TC28 - save sysbase SAVRST1 to iASP TEMPLIB
          ibmi_object_save:
            object_lib: 'SAVRST1'
            savefile_name: 'SAVTEST2'
            savefile_lib: 'TEMPLIB'
            asp_group: "{{iasp_list.row[0]['DEVICE_DESCRIPTION_NAME']}}"
            joblog: true
          register: savobj_result

    # ── TC29 - Restore from iASP save to sysbase lib ─────────────────────────
    - name: TC29 - restore objects from iASP savefile to sysbase lib
      when: (tc_execute is not defined or 'TC29' in tc_execute) and 'TC29' not in (tc_skip | default([]))
      block:
        - name: TC29 - restore SAVTEST2 from iASP TEMPLIB to sysbase SAVRST1
          ibmi_object_restore:
            object_lib: 'SAVRST1'
            savefile_name: 'SAVTEST2'
            savefile_lib: 'TEMPLIB'
            asp_group: "{{iasp_list.row[0]['DEVICE_DESCRIPTION_NAME']}}"

    # ── TC30 - Save from sysbase lib to sysbase lib (with asp_group) ─────────
    - name: TC30 - save objects from sysbase lib to sysbase lib (asp_group set)
      when: (tc_execute is not defined or 'TC30' in tc_execute) and 'TC30' not in (tc_skip | default([]))
      block:
        - name: TC30 - save sysbase SAVRST1 to sysbase ARCHLIB
          ibmi_object_save:
            object_lib: 'SAVRST1'
            savefile_name: 'SAVTEST1'
            savefile_lib: 'ARCHLIB'
            asp_group: "{{iasp_list.row[0]['DEVICE_DESCRIPTION_NAME']}}"
          register: savobj_result

    # ── TC31 - Restore from sysbase lib to sysbase lib (with asp_group) ──────
    - name: TC31 - restore objects from sysbase savefile to sysbase lib (asp_group set)
      when: (tc_execute is not defined or 'TC31' in tc_execute) and 'TC31' not in (tc_skip | default([]))
      block:
        - name: TC31 - restore SAVTEST1 from sysbase ARCHLIB to sysbase SAVRST1
          ibmi_object_restore:
            object_lib: 'SAVRST1'
            savefile_name: 'SAVTEST1'
            savefile_lib: 'ARCHLIB'
            asp_group: "{{iasp_list.row[0]['DEVICE_DESCRIPTION_NAME']}}"

  when: iasp_list.row_count != 0

  always:
    - name: Cleanup - delete iASP and sysbase libraries
      ibmi_cl_command:
        cmd: "dltlib lib({{item}})"
        joblog: 'true'
        asp_group: "{{iasp_list.row[0]['DEVICE_DESCRIPTION_NAME']}}"
      with_items:
        - SAVRST
        - SAVRST1
        - ARCHLIB
        - TEMPLIB
      ignore_errors: true
