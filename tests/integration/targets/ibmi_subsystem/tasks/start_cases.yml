- block:
    # Tests for start operation

    - name: Print header for start operation testing
      debug:
        msg: "Performing start operation test cases"

    - name: Check whether QBATCH is running
      ibmi_sql_query:
        sql: "SELECT * 
              FROM TABLE(QSYS2.ACTIVE_JOB_INFO(
              SUBSYSTEM_LIST_FILTER => 'QBATCH')) X"
      register: sql_result

    - name: End QBATCH immediately if it is running
      ibmi_cl_command:
        cmd: 'ENDSBS SBS(QBATCH) OPTION(*IMMED)'
      when: sql_result.row | length == 1

    - name: Pause to wait for sbs end
      pause: 
        seconds: 20
      when: sql_result.row | length == 1

    - name: TC01 start subsystem QBATCH with all supported options
      ibmi_subsystem:
        operation: start
        subsystem: QBATCH
        library: QSYS
      register: strsbs_result

    - name: TC01 assert the returned parameters
      assert:
        that: 
          #- "'CPF0902' in strsbs_result.stdout"
          #- strsbs_result.stderr is not defined
          #- strsbs_result.stderr_lines is not defined 
          - strsbs_result.stdout_lines is defined
          - strsbs_result.rc == 0
          - strsbs_result.job_log == []  

    - name: TC01 check whether QBATCH is running
      ibmi_sql_query:
        sql: "SELECT * 
              FROM TABLE(QSYS2.ACTIVE_JOB_INFO(
              SUBSYSTEM_LIST_FILTER => 'QBATCH')) X"
      register: sql_result
      until: sql_result.row | length == 1
      retries: 5
      delay: 60

    - name: TC01 end QBATCH if it is running
      ibmi_cl_command:
        cmd: 'ENDSBS SBS(QBATCH) OPTION(*IMMED)'

    - name: TC01 pause to wait for sbs end
      pause: 
        seconds: 20

    - name: TC02 start QBATCH subsystem with default options
      ibmi_subsystem:
        operation: start
        subsystem: QBATCH
        joblog: true
      register: strsbs_result

    - name: TC02 assert the returned parameters when joblog
      assert:
        that: 
          #- "'CPF0902' in strsbs_result.stdout"
          #- strsbs_result.stderr is not defined
          #- strsbs_result.stderr_lines is not defined 
          - strsbs_result.stdout_lines is defined
          - strsbs_result.rc == 0
          - strsbs_result.job_log != [] 

    - name: TC03 start idempotency test. Start a running/active subsystem.
      ibmi_subsystem:
        operation: start
        subsystem: QBATCH
      register: strsbs_result

    - name: TC03 assert the returned parameters
      assert:
        that:
          - strsbs_result.stdout is defined
          - strsbs_result.rc == 0

    - name: TC04 Negative start test. Start a non-existing sbs.
      ibmi_subsystem:
        operation: start
        subsystem: abc
        joblog: true
      register: strsbs_result 
      failed_when: "strsbs_result.job_log | selectattr('MESSAGE_ID', 'equalto', 'CPF1013') | map(attribute='MESSAGE_ID') | list | length ==0"

    - name: TC04 assert the returned parameters when joblog
      assert:
        that: 
          - strsbs_result.job_log != [] 

    - name: TC05 Negative start test. Start with a wrong lib for QBATCH
      ibmi_subsystem:
        operation: start
        subsystem: QBATCH    
        library: abc
        joblog: true
      register: strsbs_result 
      failed_when: "strsbs_result.job_log | selectattr('MESSAGE_ID', 'equalto', 'CPF1080') | map(attribute='MESSAGE_ID') | list | length ==0"

    - name: TC04 assert the returned parameters when joblog
      assert:
        that: 
          - strsbs_result.job_log != [] 

    - name: TC06 start. Missing required option subsystem (negative test case)
      ibmi_subsystem:
        operation: start
      register: strsbs_result
      failed_when: "'missing required argument' not in strsbs_result.msg"

    - name: TC07 start. Missing required option operation (negative test case)
      ibmi_subsystem:
        subsystem: QBATCH
      register: strsbs_result
      failed_when: "'missing required argument' not in strsbs_result.msg"

    - name: TC08 Provide invalid option for start (negative test case)
      ibmi_subsystem:
        operation: start
        subsystem: QBATCH 
        abc: abc   
      register: strsbs_result
      failed_when: "'Unsupported parameters' not in strsbs_result.msg" 
