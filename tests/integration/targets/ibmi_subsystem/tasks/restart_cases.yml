- block:
    # Tests for restart operation

    - name: Print header for restart operation testing
      debug:
        msg: "Performing restart operation test cases"

    # First ensure that QBATCH is inactive
    - name: TC00 end the host server if it is running
      ibmi_subsystem:
        operation: end
        subsystem: QBATCH
        how_to_end: '*IMMED'
        controlled_end_delay_time: 60
        end_subsystem_option: '*DFT'
        parameters: ''
      register: endsbs_result

    - name: TC00 assert the returned parameters
      assert:
        that: 
          #- "'CPF0943' in endsbs_result.stdout"
          - endsbs_result.stderr is defined
          - endsbs_result.stderr_lines is defined 
          - endsbs_result.stdout_lines is defined
          - endsbs_result.rc == 0
          - endsbs_result.job_log == []
  
    - name: TC00 pause 20 seconds to wait for sbs end
      pause: 
        seconds: 20

    - name: TC00 check whether QBATCH is running
      ibmi_sql_query:
        sql: "SELECT * 
              FROM TABLE(QSYS2.ACTIVE_JOB_INFO(
              SUBSYSTEM_LIST_FILTER => 'QBATCH')) X"
      register: sql_result
      failed_when: sql_result.row | length != 0 

    - name: TC01 Idempotent restart case when inactive, restart an inactive BATCH subsystem
      ibmi_subsystem:
        operation: restart
        subsystem: QBATCH
      register: results
      failed_when: results.rc != 0

    - name: TC02 Restart active BATCH subsystem
      ibmi_subsystem:
        operation: restart
        subsystem: QBATCH
      register: results
      failed_when: results.rc != 0

    - name: TC02A restart negative, end all inactive subsystems
      ibmi_subsystem:
        operation: end
        subsystem: '*all'
      register: endsbs_result
      failed_when: "'End all subsystems is NOT allowed' not in endsbs_result.msg"

    - name: TC03 Negative restart test. Restart a non-existing sbs.
      ibmi_subsystem:
        operation: restart
        subsystem: abc
        joblog: true
      register: strsbs_result 
      failed_when: "strsbs_result.job_log | selectattr('MESSAGE_ID', 'equalto', 'CPF1054') | map(attribute='MESSAGE_ID') | list | length ==0"

    - name: TC03 assert the returned parameters when joblog
      assert:
        that: 
          - strsbs_result.job_log != [] 

    - name: TC04 Negative restart test. Restart with a wrong lib for QBATCH
      ibmi_subsystem:
        operation: restart
        subsystem: QBATCH  
        library: abc
        joblog: true
      register: strsbs_result 
      failed_when: "strsbs_result.job_log | selectattr('MESSAGE_ID', 'equalto', 'CPF1080') | map(attribute='MESSAGE_ID') | list | length ==0"

    - name: TC04 assert the returned parameters when joblog
      assert:
        that: 
          - strsbs_result.job_log != [] 

    - name: TC05 restart. Missing required option subsystem (negative test case)
      ibmi_subsystem:
        operation: restart
      register: strsbs_result
      failed_when: "'missing required argument' not in strsbs_result.msg"

    - name: TC06 restart. Missing required option operation (negative test case)
      ibmi_subsystem:
        subsystem: QBATCH
      register: strsbs_result
      failed_when: "'missing required argument' not in strsbs_result.msg"

    - name: TC07 Provide invalid option for restart (negative test case)
      ibmi_subsystem:
        operation: restart
        subsystem: QBATCH 
        abc: abc   
      register: strsbs_result
      failed_when: "'Unsupported parameters' not in strsbs_result.msg" 
