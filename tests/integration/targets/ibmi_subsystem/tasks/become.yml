# Test become_user and become_user_password with ibmi_subsystem operations
# Requires ansible_ssh_user and ansible_ssh_pass to be defined
#
# Execute/skip list usage:
#   tc_execute: optional list of TC IDs to run  (e.g. ['BECOME_TC01','BECOME_TC04'])
#   tc_skip:    optional list of TC IDs to skip
#   If neither variable is defined, all TCs run (default behaviour).
#
# TC descriptions:
#   BECOME_TC01   Setup — check if QBATCH is running; start if inactive.
#   BECOME_TC02   End QBATCH using become_user credentials.
#   BECOME_TC03   Start QBATCH using become_user (elevated) credentials.
#   BECOME_TC04   Restart QBATCH using become_user (elevated) credentials.
#   BECOME_TC05   End QBATCH using become_user; assert subsystem inactive.
#
- set_fact:
    becomeuser: 'anbecome'
    becomepwd: 'password'
    libname: 'becomelib'
  no_log: true

- block:
    - name: Print header for become_user and become_user_password parameter testing.
      debug:
        msg: "Performing test cases for using become_user and become_user_password with ibmi_subsystem"

    - name: Create user profile with required options.
      ibmi_user_and_group:
        operation: 'create'
        user: '{{becomeuser}}'
        password: '{{becomepwd}}'

    - name: Display user profile with required options.
      ibmi_user_and_group:
        operation: 'display'
        user: '{{becomeuser}}'
      register: user_result

    # ─── BECOME_TC01 - Setup: check/start QBATCH ─────────────────────────────────
    - name: BECOME_TC01 - setup check and start QBATCH
      when: (tc_execute is not defined or 'BECOME_TC01' in tc_execute) and 'BECOME_TC01' not in (tc_skip | default([]))
      block:
        - name: BECOME_TC01 - become. Check whether QBATCH is running.
          ibmi_sql_query:
            sql: "SELECT *
                  FROM TABLE(QSYS2.ACTIVE_JOB_INFO(
                  SUBSYSTEM_LIST_FILTER => 'QBATCH')) X"
          register: sql_result_orig

        - name: BECOME_TC01 - become. Start subsystem if it is not running.
          ibmi_subsystem:
            operation: start
            subsystem: QBATCH
            library: QSYS
          when: sql_result_orig.row | length == 0

    # ─── BECOME_TC02 - End QBATCH using become_user credentials ──────────────────
    - name: BECOME_TC02 - become end QBATCH
      when: (tc_execute is not defined or 'BECOME_TC02' in tc_execute) and 'BECOME_TC02' not in (tc_skip | default([]))
      block:
        - name: BECOME_TC02 - become. End the host server if it is running.
          ibmi_subsystem:
            operation: end
            subsystem: QBATCH
            how_to_end: '*IMMED'
            controlled_end_delay_time: 60
            end_subsystem_option: '*DFT'
            parameters: ''
            become_user: '{{becomeuser.upper()}}'
            become_user_password: '{{becomepwd}}'
          register: endsbs_result
          failed_when: "endsbs_result.rc != 0 and (endsbs_result.job_log | selectattr('MESSAGE_ID', 'equalto', 'CPF1038') | map(attribute='MESSAGE_ID') | list | length) == 0"

    - name: Backup original ansible_ssh_user
      set_fact:
        org_user: '{{ansible_ssh_user}}'

    - name: Backup original ansible_ssh_pass
      no_log: true
      set_fact:
        org_user_password: '{{ansible_ssh_pass}}'
      when: ansible_ssh_pass is defined

    - name: Set ansible_ssh_user to *USRCLS
      no_log: true
      set_fact:
        ansible_ssh_user: '{{becomeuser}}'
        ansible_ssh_pass: '{{becomepwd}}'

    # ─── BECOME_TC03 - Start QBATCH using become_user (elevated) ─────────────────
    - name: BECOME_TC03 - become start QBATCH
      when: (tc_execute is not defined or 'BECOME_TC03' in tc_execute) and 'BECOME_TC03' not in (tc_skip | default([])) and org_user_password is defined
      block:
        - name: BECOME_TC03 - become. Start subsystem if it is not running.
          ibmi_subsystem:
            operation: start
            subsystem: QBATCH
            library: QSYS
            become_user: '{{org_user}}'
            become_user_password: '{{org_user_password}}'
          when: sql_result_orig.row | length == 0

    # ─── BECOME_TC04 - Restart QBATCH using become_user (elevated) ───────────────
    - name: BECOME_TC04 - become restart QBATCH
      when: (tc_execute is not defined or 'BECOME_TC04' in tc_execute) and 'BECOME_TC04' not in (tc_skip | default([])) and org_user_password is defined
      block:
        - name: BECOME_TC04 - become. Restart subsystem.
          ibmi_subsystem:
            operation: restart
            subsystem: QBATCH
            library: QSYS
            become_user: '{{org_user}}'
            become_user_password: '{{org_user_password}}'

    # ─── BECOME_TC05 - End QBATCH using become_user; assert inactive ──────────────
    - name: BECOME_TC05 - become end QBATCH and assert inactive
      when: (tc_execute is not defined or 'BECOME_TC05' in tc_execute) and 'BECOME_TC05' not in (tc_skip | default([])) and org_user_password is defined
      block:
        - name: BECOME_TC05 - become. End the host server if it is running.
          ibmi_subsystem:
            operation: end
            subsystem: QBATCH
            how_to_end: '*IMMED'
            controlled_end_delay_time: 60
            end_subsystem_option: '*DFT'
            parameters: ''
            become_user: '{{org_user}}'
            become_user_password: '{{org_user_password}}'
          register: endsbs_result

        - name: BECOME_TC05 - pause 20 seconds to wait for sbs end
          pause:
            seconds: 20

        - name: BECOME_TC05 - become. Check whether QBATCH is running.
          ibmi_sql_query:
            sql: "SELECT *
                  FROM TABLE(QSYS2.ACTIVE_JOB_INFO(
                  SUBSYSTEM_LIST_FILTER => 'QBATCH')) X"
          register: sql_result
          failed_when: sql_result.row | length != 0

  always:
    - name: Set ansible_ssh_user and password back to original settings
      no_log: true
      set_fact:
        ansible_ssh_user: '{{org_user.upper()}}'
        ansible_ssh_pass: '{{org_user_password}}'
      when: org_user_password is defined
      ignore_errors: true

    - name: Delete the user profile
      ibmi_user_and_group:
        operation: 'delete'
        user: '{{becomeuser}}'
        parameters: "OWNOBJOPT(*DLT)"
      register: user_result
      ignore_errors: true
