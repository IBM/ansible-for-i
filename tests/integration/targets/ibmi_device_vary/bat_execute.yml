# BAT (Build Acceptance Test) execute list for ibmi_device_vary
#
# These test cases are run on every Jenkins build as a fast smoke test.
# Only the TCs listed here will execute when this file is loaded as tc_execute.
#
# Dependency note: TC01 → TC02 → TC03 → TC04 form a chain.
#   TC01 varies ANSIT1 on, TC02 verifies it is active, TC03 varies it on again
#   (idempotent), TC04 varies both devices off.
#   All four must be present together in any execute list that includes TC04.
#   Negative tests TC05–TC11 are independent and safe to run in any order.

tc_execute:
  - TC01
  - TC02
  - TC03
  - TC04
  - TC05
  - TC06
