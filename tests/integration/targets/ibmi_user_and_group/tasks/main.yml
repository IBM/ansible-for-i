#
# Execute/skip list usage:
#   tc_execute: optional list of TC IDs to run — each sub-file honours this same variable.
#               TC IDs are namespaced by file:
#                 display.yml       → DISP_TC01, DISP_TC02
#                 user_and_group.yml→ TC03–TC20, TC16B, TC19A
#                 negative_case.yml → NEG_TC21–NEG_TC35
#   tc_skip:    optional list of TC IDs to skip — everything else runs.
#   If neither variable is defined, all TCs run (default behaviour).
#
- set_fact:
    new_user: [ansiuser1]
    pwd: 'ansipwd'
    new_group: [ANGRP1, angrp2]

- ansible.builtin.include_tasks: display.yml
- ansible.builtin.include_tasks: user_and_group.yml
- ansible.builtin.include_tasks: negative_case.yml
