#
# Execute/skip list usage:
#   tc_execute: optional list of TC IDs to run  (e.g. ['DISP_TC01'])
#   tc_skip:    optional list of TC IDs to skip
#   If neither variable is defined, all TCs run (default behaviour).
#
# TC descriptions:
#   DISP_TC01   Display the current SSH user profile; assert result_set fields.
#   DISP_TC02   Display with extra options (they must be ignored); assert same result.
#

# ─── DISP_TC01 - Display current SSH user profile ────────────────────────────
- name: DISP_TC01 - display a user profile
  when: (tc_execute is not defined or 'DISP_TC01' in tc_execute) and 'DISP_TC01' not in (tc_skip | default([]))
  block:
    - name: DISP_TC01 - display a user profile
      ibmi_user_and_group:
        operation: 'display'
        user: '{{ansible_ssh_user}}'
      register: user_result

    - name: DISP_TC01 - assert return options
      assert:
        that:
          - user_result.stdout is not defined
          - user_result.stderr is not defined
          - user_result.stdout_lines is not defined
          - user_result.stderr_lines is not defined
          - user_result.result_set | length == 1
          - user_result.result_set[0]['AUTHORIZATION_NAME'] == ansible_ssh_user.upper()

# ─── DISP_TC02 - Display with extra options (must be ignored) ────────────────
- name: DISP_TC02 - display with other options to ensure they are ignored
  when: (tc_execute is not defined or 'DISP_TC02' in tc_execute) and 'DISP_TC02' not in (tc_skip | default([]))
  block:
    - name: DISP_TC02 - display with other options to ensure other options are ignored
      ibmi_user_and_group:
        operation: 'display'
        user: '{{ansible_ssh_user}}'
        password: '{{pwd}}'
        expire: '*YES'
        status: '*DISABLED'
        user_class: '*SYSOPR'
        special_authority: ['*ALLOBJ', '*AUDIT']
        user_group: ''
        owner: '*USRPRF'
        text: 'Created by ansible'
        parameters: ''
      register: user_result

    - name: DISP_TC02 - assert return options
      assert:
        that:
          - user_result.stdout is not defined
          - user_result.stderr is not defined
          - user_result.stdout_lines is not defined
          - user_result.stderr_lines is not defined
          - user_result.result_set | length == 1
          - user_result.result_set[0]['AUTHORIZATION_NAME'] == ansible_ssh_user.upper()
