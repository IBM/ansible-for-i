#
# Execute/skip list usage:
#   tc_execute: optional list of TC IDs to run  (e.g. ['NEG_TC21','NEG_TC29'])
#   tc_skip:    optional list of TC IDs to skip
#   If neither variable is defined, all TCs run (default behaviour).
#
# TC descriptions:
#   NEG_TC21   Display a non-existing user; expect "not found" in msg.
#   NEG_TC22   Run with invalid operation value; expect "value of operation must be one of".
#   NEG_TC23   Run with invalid expire value; expect "value of expire must be one of".
#   NEG_TC24   Run with invalid status value; expect "value of status must be one of".
#   NEG_TC25   Run with invalid user_class value; expect "value of user_class must be one of".
#   NEG_TC26   Run with invalid special_authority value; expect "value of special_authority must be one or more of".
#   NEG_TC27   Run with invalid owner value; expect "value of owner must be one of".
#   NEG_TC28   Run with invalid parameters; no specific failure check (runs with ignore_errors).
#   NEG_TC29   Display with missing required user option; expect "missing required arguments: user".
#   NEG_TC30   Run with missing required operation option; expect "missing required arguments: operation".
#   NEG_TC31   Display with unsupported option; expect "Unsupported parameters".
#   NEG_TC33   Change a non-existing user; expect "User profile ABC not found".
#   NEG_TC35   Display group members for non-existing group; expect "Group profile ABC not found".
#

# ─── NEG_TC21 - Display a non-existing user ───────────────────────────────────
- name: NEG_TC21 - display a non-existing user profile
  when: (tc_execute is not defined or 'NEG_TC21' in tc_execute) and 'NEG_TC21' not in (tc_skip | default([]))
  block:
    - name: NEG_TC21 - display a not existing user profile
      ibmi_user_and_group:
        operation: 'display'
        user: 'abc123456'
      register: user_result
      failed_when: "'User ABC123456 not found' not in user_result.msg"

# ─── NEG_TC22 - Invalid operation value ───────────────────────────────────────
- name: NEG_TC22 - run with invalid operation
  when: (tc_execute is not defined or 'NEG_TC22' in tc_execute) and 'NEG_TC22' not in (tc_skip | default([]))
  block:
    - name: NEG_TC22 - run with invalid operation
      ibmi_user_and_group:
        operation: 'abc'
        user: '{{ansible_ssh_user}}'
      register: user_result
      failed_when: "'value of operation must be one of:' not in user_result.msg"

# ─── NEG_TC23 - Invalid expire value ──────────────────────────────────────────
- name: NEG_TC23 - run with invalid expire
  when: (tc_execute is not defined or 'NEG_TC23' in tc_execute) and 'NEG_TC23' not in (tc_skip | default([]))
  block:
    - name: NEG_TC23 - run with invalid expire
      ibmi_user_and_group:
        operation: 'display'
        user: '{{ansible_ssh_user}}'
        expire: 'ABC'
        status: '*ENABLED'
        user_class: '*SECOFR'
        special_authority: ['*ALLOBJ', '*IOSYSCFG', '*SECADM', '*SERVICE', '*SPLCTL']
        user_group: 'new_group[1]'
        owner: '*USRPRF'
        text: 'ANSIBLE TESTING'
        parameters: "HOMEDIR('/home/{{new_user[0]}}')"
      register: user_result
      failed_when: "'value of expire must be one of:' not in user_result.msg"

