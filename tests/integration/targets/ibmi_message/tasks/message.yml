#
# tc_execute / tc_skip variables flow through automatically from main.yml.
# ANSITEST lib, TRYMSGQ1, and TRYMSGQ2 are created by main.yml setup before this file runs.

- name: Setup - send INFORMATIONAL messages to both queues
  ibmi_cl_command:
    cmd: "QSYS/SNDMSG MSG('{{ item[1] }}') TOMSGQ({{ msgq_lib }}/{{ item[0] }})"
  with_nested:
    - "{{ msgq }}"
    - "{{ info_msg_text }}"

# ─── TC15 - Find INFORMATIONAL with all supported options ─────────────────────
- name: TC15 - find INFORMATIONAL message with all supported options
  when: (tc_execute is not defined or 'TC15' in tc_execute) and 'TC15' not in (tc_skip | default([]))
  block:
    - name: TC15 - find message in TRYMSGQ1 by text and type
      ibmi_message:
        operation: 'find'
        message_type: 'INFORMATIONAL'
        message_queue: '{{ msgq[0] }}'
        message_lib: '{{ msgq_lib }}'
        message_id: ''
        message_text: 'TRY FRIST ANSIBLE INFORMATION MESSAGE'
      register: find_result

    - name: TC15 - assert returned fields and message content
      assert:
        that:
          - find_result.start is defined
          - find_result.end is defined
          - find_result.delta is defined
          - find_result.stderr is defined
          - find_result.message_info | length == 1
          - find_result.message_info[0]['MESSAGE_TEXT'] == info_msg_text[0]
          - find_result.message_info[0]['MESSAGE_TYPE'] == 'INFORMATIONAL'

# ─── TC16 - Find INFORMATIONAL with lowercase message_lib ─────────────────────
# Low priority issue, may enhance in future
- name: TC16 - find INFORMATIONAL with lowercase message_lib
  when: (tc_execute is not defined or 'TC16' in tc_execute) and 'TC16' not in (tc_skip | default([]))
  block:
    - name: TC16 - find messages using lowercase lib name
      ibmi_message:
        operation: 'find'
        message_type: 'INFORMATIONAL'
        message_queue: '{{ msgq[0] }}'
        message_lib: '{{ msgq_lib.lower() }}'
      register: find_result

    - name: TC16 - assert 2 messages found
      assert:
        that:
          - find_result.message_info | length == 2

# ─── TC17 - Find INFORMATIONAL with lowercase message_queue ───────────────────
- name: TC17 - find INFORMATIONAL with lowercase message_queue and text filter
  when: (tc_execute is not defined or 'TC17' in tc_execute) and 'TC17' not in (tc_skip | default([]))
  block:
    - name: TC17 - find messages using lowercase queue name and partial text
      ibmi_message:
        operation: 'find'
        message_type: 'INFORMATIONAL'
        message_queue: '{{ msgq[0].lower() }}'
        message_lib: '{{ msgq_lib }}'
        message_text: 'TRY FRIST ANSIBLE'
      register: find_result

    - name: TC17 - assert 1 message found
      assert:
        that:
          - find_result.message_info | length == 1

# ─── TC18 - Find INFORMATIONAL with only required options ─────────────────────
- name: TC18 - find INFORMATIONAL with only required options (lib-wide)
  when: (tc_execute is not defined or 'TC18' in tc_execute) and 'TC18' not in (tc_skip | default([]))
  block:
    - name: TC18 - find all informational messages in lib
      ibmi_message:
        operation: 'find'
        message_type: 'INFORMATIONAL'
        message_lib: '{{ msgq_lib }}'
      register: find_result

    - name: TC18 - assert returned fields and 4 total messages
      assert:
        that:
          - find_result.start is defined
          - find_result.end is defined
          - find_result.delta is defined
          - find_result.stderr is defined
          - find_result.message_info | length == 4

# ─── TC19/TC20 - Find INFORMATIONAL in two queues by text ─────────────────────
- name: TC19 - find INFORMATIONAL in both queues filtered by text
  when: (tc_execute is not defined or 'TC19' in tc_execute) and 'TC19' not in (tc_skip | default([]))
  block:
    - name: TC19 - find messages in TRYMSGQ1 and TRYMSGQ2 by text
      ibmi_message:
        operation: 'find'
        message_type: 'INFORMATIONAL'
        message_lib: '{{ msgq_lib }}'
        message_queue: '{{ msgq }}'
        message_text: 'TRY FRIST ANSIBLE INFORMATION MESSAGE'
      register: find_result

    - name: TC20 - assert 2 messages found (one per queue)
      assert:
        that:
          - find_result.start is defined
          - find_result.end is defined
          - find_result.delta is defined
          - find_result.stderr is defined
          - find_result.message_info | length == 2

# ─── TC21 - Negative: invalid operation value ────────────────────────────────
- name: TC21 - negative - invalid operation value 'abc'
  when: (tc_execute is not defined or 'TC21' in tc_execute) and 'TC21' not in (tc_skip | default([]))
  block:
    - name: TC21 - call with operation=abc (expect module parameter error)
      ibmi_message:
        operation: 'abc'
        message_type: 'INQUIRY'
        message_queue: '{{ msgq[0] }}'
        message_lib: '{{ msgq_lib }}'
        message_text: 'TRY FRIST ANSIBLE INFORMATION MESSAGE'
      register: neg_result
      failed_when: "'value of operation must be one of' not in neg_result.msg"

