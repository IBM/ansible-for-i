# ─── TC13 ─────────────────────────────────────────────────────────────────────
- name: TC13 - Copy with an invalid option (expected failure)
  when: (tc_execute is not defined or 'TC13' in tc_execute) and 'TC13' not in (tc_skip | default([]))
  block:
    - name: TC13 Copy with an invalid option
      ibmi_copy:
        src: '{{ savf_name }}'
        lib_name: '{{remote_temp_lib}}'
        abc: abc
      register: neg_result
      ignore_errors: true

    - assert:
        that:
          - "'Invalid options for ibmi_copy' in neg_result.msg"

