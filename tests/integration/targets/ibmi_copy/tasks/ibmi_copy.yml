# ─── TC17 ─────────────────────────────────────────────────────────────────────
- name: TC17 - Copy a non-existing FILE (expected failure)
  when: (tc_execute is not defined or 'TC17' in tc_execute) and 'TC17' not in (tc_skip | default([]))
  block:
    - name: TC17 Copy objects with not existing FILE
      ibmi_copy:
        src: '{{ local_temp_dir }}/abc.FILE'
        lib_name: '{{remote_temp_lib}}'
      register: neg_result
      failed_when: "'Could not find or access' not in neg_result.msg"

# ─── TC18 ─────────────────────────────────────────────────────────────────────
- name: TC18 - Copy to a non-existing library (expected failure)
  when: (tc_execute is not defined or 'TC18' in tc_execute) and 'TC18' not in (tc_skip | default([]))
  block:
    - name: TC18 Copy objects with a not existing lib
      ibmi_copy:
        src: '{{ savf_name }}'
        lib_name: 'ABC'
      register: neg_result
      failed_when: "neg_result.job_log | selectattr('MESSAGE_ID', 'equalto', 'CPF7302') | map(attribute='MESSAGE_ID') | list | length == 0"
