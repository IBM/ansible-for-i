  block:
    - name: NTC07 set incomplete credentials
      ansible.builtin.set_fact:
        incomplete_credentials:
          machine_model: "HEX"
          machine_type: "9080"
          # Missing serial_number and country

    - name: NTC07 attempt download with incomplete credentials
      ibm.power_ibmi.ibmi_download_fix_from_cloud:
        ptf_id: "{{ test_ptf_id }}"
        credentials: "{{ incomplete_credentials }}"
        operation: "validate"
        directory: "{{ test_download_dir_neg }}_incomplete"
