---
# Negative test cases for ibmi_download_fix_from_cloud module
# (c) IBM Corporation 2019, 2020
# GNU General Public License v3 or later (see COPYING or https://www.gnu.org/licenses/gpl-3.0.txt )
#
# Execute/skip list usage:
#   tc_execute: optional list of TC IDs to run  (e.g. ['NTC01','NTC05']) — only those TCs run
#   tc_skip:    optional list of TC IDs to skip (e.g. ['NTC06']) — everything else runs
#   If neither variable is defined, all TCs run (default behaviour).
#
# TC dependency notes:
#   All NTCs are independent negative/error tests — no server state created.
#   NTC01  invalid credentials — hits the cloud API, fast (~2-5s)
#   NTC02  missing ptf_id — Ansible parameter validation, instant
#   NTC03  missing credentials — Ansible parameter validation, instant
#   NTC04  missing directory — Ansible parameter validation, instant
#   NTC05  invalid operation value — Ansible parameter validation, instant
#   NTC06  invalid directory path (permission denied) — no download, instant
#   NTC07  incomplete credentials dict — hits the cloud API, fast (~2-5s)
#   NTC08  empty PTF ID — module validation, instant
#   NTC09  invalid boolean for include_requisites — Ansible parameter validation, instant
#

- name: Set test variables for negative tests
  ansible.builtin.set_fact:
    test_ptf_id: "SJ08667" # Valid PTF ID for tests that need it
    test_download_dir_neg: "/tmp/ansible_test_ptf_download_neg_{{ ansible_date_time.epoch }}"
    test_credentials:
      machine_model: "HEX"
      machine_type: "9080"
      serial_number: "XXXXXXX"   # TODO: Replace variable needs to pass through Jenkins 
      country: "US"
    test_invalid_credentials:
      machine_model: "INVALID"
      machine_type: "0000"
      serial_number: "0000000"
      country: "XX"

# ─── NTC01 ────────────────────────────────────────────────────────────────────
- name: NTC01 - Invalid credentials (entitlement check fails)
  when: (tc_execute is not defined or 'NTC01' in tc_execute) and 'NTC01' not in (tc_skip | default([]))
  block:
    - name: NTC01 attempt download with invalid credentials
      ibm.power_ibmi.ibmi_download_fix_from_cloud:
        ptf_id: "{{ test_ptf_id }}"
        credentials: "{{ test_invalid_credentials }}"
        operation: "validate"
        directory: "{{ test_download_dir_neg }}_cred"
      register: invalid_cred_result
      delegate_to: localhost
      failed_when: false

    - name: NTC01 assert invalid credentials failed
      ansible.builtin.assert:
        that:
          - invalid_cred_result is defined
          - invalid_cred_result.msg is defined
          - "'Client.Authentication.NotAuthorized' in invalid_cred_result.msg"
        fail_msg: "Invalid credentials should have failed entitlement check"
        success_msg: "Invalid credentials correctly failed entitlement check"

    - name: NTC01 display invalid credentials error
      ansible.builtin.debug:
        var: invalid_cred_result

  always:
    - name: NTC01 clean up
      ansible.builtin.file:
        path: "{{ test_download_dir_neg }}_cred"
        state: absent
      delegate_to: localhost
      failed_when: false

# ─── NTC02 ────────────────────────────────────────────────────────────────────
- name: NTC02 - Missing required parameter (ptf_id)
  when: (tc_execute is not defined or 'NTC02' in tc_execute) and 'NTC02' not in (tc_skip | default([]))
  block:
    - name: NTC02 attempt download without PTF ID
      ibm.power_ibmi.ibmi_download_fix_from_cloud:
        credentials: "{{ test_credentials }}"
        operation: "download"
        directory: "{{ test_download_dir_neg }}_missing"
      register: missing_ptf_result
      delegate_to: localhost
      failed_when: false
      # args[module]: Intentionally missing ptf_id to test error handling
      tags:
        - skip_ansible_lint

    - name: NTC02 assert missing PTF ID failed
      ansible.builtin.assert:
        that:
          - missing_ptf_result is defined
          - missing_ptf_result.msg is defined
          - "'missing required arguments: ptf_id' in missing_ptf_result.msg"
        fail_msg: "Missing PTF ID should have failed"
        success_msg: "Missing PTF ID correctly failed"

    - name: NTC02 display missing parameter error
      ansible.builtin.debug:
        var: missing_ptf_result

  always:
    - name: NTC02 clean up
      ansible.builtin.file:
        path: "{{ test_download_dir_neg }}_missing"
        state: absent
      delegate_to: localhost
      failed_when: false

