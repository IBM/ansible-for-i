          - "'value of operation must be one of' in invalid_op_result.msg"
        fail_msg: "Invalid operation should have failed"
        success_msg: "Invalid operation correctly failed"

    - name: NTC05 display invalid operation error
      ansible.builtin.debug:
        var: invalid_op_result

  always:
