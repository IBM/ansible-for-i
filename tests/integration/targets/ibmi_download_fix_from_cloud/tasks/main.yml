#
# Execute/skip list usage:
#   tc_execute: optional list of TC IDs to run — IDs must match those defined in
#               positive_tests.yml (PTC01–PTC06) or negative_tests.yml (NTC01–NTC09).
#               Only the listed IDs will run; all others are skipped.
#   tc_skip:    optional list of TC IDs to skip — everything else runs.
#   If neither variable is defined, all TCs in both files run.
#
# The tc_execute / tc_skip variables are passed through automatically to the
# included files — no extra plumbing needed.
#

- name: Include positive test cases
  ansible.builtin.include_tasks: positive_tests.yml

- name: Include negative test cases
  ansible.builtin.include_tasks: negative_tests.yml
