---
# Positive test cases for ibmi_download_fix_from_cloud module
# (c) IBM Corporation 2019, 2020
# GNU General Public License v3 or later (see COPYING or https://www.gnu.org/licenses/gpl-3.0.txt )
#
# Execute/skip list usage:
#   tc_execute: optional list of TC IDs to run  (e.g. ['PTC01','PTC03']) — only those TCs run
#   tc_skip:    optional list of TC IDs to skip (e.g. ['PTC04']) — everything else runs
#   If neither variable is defined, all TCs run (default behaviour).
#
# TC dependency notes:
#   PTC01  preview operation  — no download, fast (~2-5s)
#   PTC02  validate operation — no download, fast (~2-5s)
#   PTC03  download without requisites (clean_directory=true) — downloads SJ08667; TIMING TBD
#   PTC04  download with requisites (clean_directory=true)    — downloads SJ08667 + prereqs; TIMING TBD
#   PTC05  download to existing directory (clean_directory=false) — downloads SJ08667; TIMING TBD
#   PTC06  download with clean_directory=true — verifies old files deleted; TIMING TBD
#
# All PTC03–PTC06 use separate directories and clean up after themselves.
# They are independent of each other and can run in any order.
#

- name: Set test variables for positive tests
  ansible.builtin.set_fact:
    test_ptf_id: "SJ08667" # Small PTF for 7.6 release
    test_download_dir: "/tmp/ansible_test_ptf_download_{{ ansible_date_time.epoch }}"
    test_credentials:
      machine_model: "HEX"      
      machine_type: "9080"       
      serial_number: "XXXXXXX"   # TODO: Replace variable needs to pass through Jenkins 
      country: "US"              

# ─── PTC01 ────────────────────────────────────────────────────────────────────
- name: PTC01 - Preview operation (no download)
  when: (tc_execute is not defined or 'PTC01' in tc_execute) and 'PTC01' not in (tc_skip | default([]))
  block:
    - name: PTC01 preview PTF information
      ibm.power_ibmi.ibmi_download_fix_from_cloud:
        ptf_id: "{{ test_ptf_id }}"
        credentials: "{{ test_credentials }}"
        operation: "preview"
        directory: "{{ test_download_dir }}"
      register: preview_result
      delegate_to: localhost

    - name: PTC01 assert preview operation succeeded
      ansible.builtin.assert:
        that:
          - preview_result is defined
          - preview_result.rc == 0
          - preview_result.updates is defined
          - preview_result.updates | length > 0
          - preview_result.msg is defined
        fail_msg: "Preview operation failed"
        success_msg: "Preview operation succeeded"

    - name: PTC01 display preview results
      ansible.builtin.debug:
        var: preview_result

# ─── PTC02 ────────────────────────────────────────────────────────────────────
- name: PTC02 - Validate operation (check entitlement without download)
  when: (tc_execute is not defined or 'PTC02' in tc_execute) and 'PTC02' not in (tc_skip | default([]))
  block:
    - name: PTC02 validate PTF entitlement
      ibm.power_ibmi.ibmi_download_fix_from_cloud:
        ptf_id: "{{ test_ptf_id }}"
        credentials: "{{ test_credentials }}"
        operation: "validate"
        directory: "{{ test_download_dir }}"
      register: validate_result
      delegate_to: localhost

    - name: PTC02 assert validate operation succeeded
      ansible.builtin.assert:
        that:
          - validate_result is defined
          - validate_result.rc == 0
          - validate_result.entitlement_verified is defined
          - validate_result.entitlement_verified == true
          - validate_result.msg is defined
        fail_msg: "Validate operation failed"
        success_msg: "Validate operation succeeded"

    - name: PTC02 display validate results
      ansible.builtin.debug:
        var: validate_result

# ─── PTC03 ────────────────────────────────────────────────────────────────────
- name: PTC03 - Download operation without requisites
  when: (tc_execute is not defined or 'PTC03' in tc_execute) and 'PTC03' not in (tc_skip | default([]))
  block:
    - name: PTC03 download PTF without requisites
      ibm.power_ibmi.ibmi_download_fix_from_cloud:
        ptf_id: "{{ test_ptf_id }}"
        credentials: "{{ test_credentials }}"
        operation: "download"
        directory: "{{ test_download_dir }}"
        include_requisites: false
        clean_directory: true
      register: download_result
      delegate_to: localhost

    - name: PTC03 assert download operation succeeded
      ansible.builtin.assert:
        that:
          - download_result is defined
          - download_result.rc == 0
          - download_result.entitlement_verified is defined
          - download_result.entitlement_verified == true
          - download_result.download_list is defined
          - download_result.download_list | length > 0
          - download_result.download_list[0].ptf_id is defined
          - download_result.download_list[0].file_name is defined
          - download_result.download_list[0].file_path is defined
          - download_result.download_list[0].product is defined
          - download_result.download_list[0].release is defined
        fail_msg: "Download operation failed"
        success_msg: "Download operation succeeded"

    - name: PTC03 display download results
      ansible.builtin.debug:
        var: download_result

    - name: PTC03 verify downloaded save file exists on disk
      ansible.builtin.stat:
        path: "{{ test_download_dir }}/{{ download_result.download_list[0].file_name }}"
      register: savefile_stat
      delegate_to: localhost

    - name: PTC03 assert save file exists
      ansible.builtin.assert:
        that:
          - savefile_stat.stat.exists
          - savefile_stat.stat.isreg or savefile_stat.stat.islnk
        fail_msg: "Downloaded save file does not exist"
        success_msg: "Downloaded save file exists"

    - name: PTC03 check for cover letter file
      ansible.builtin.stat:
        path: "{{ test_download_dir }}/Q{{ test_ptf_id }}.MBR"
      register: coverletter_stat
      delegate_to: localhost

    - name: PTC03 assert cover letter exists
      ansible.builtin.assert:
        that:
          - coverletter_stat.stat.exists
          - coverletter_stat.stat.isreg or coverletter_stat.stat.islnk
        fail_msg: "Cover letter file does not exist"
        success_msg: "Cover letter file exists"

  always:
    - name: PTC03 clean up downloaded files
      ansible.builtin.file:
        path: "{{ test_download_dir }}"
        state: absent
      delegate_to: localhost
      failed_when: false

# ─── PTC04 ────────────────────────────────────────────────────────────────────
- name: PTC04 - Download operation with requisites
  when: (tc_execute is not defined or 'PTC04' in tc_execute) and 'PTC04' not in (tc_skip | default([]))
  block:
    - name: PTC04 create new download directory for requisites test
      ansible.builtin.set_fact:
        test_download_dir_req: "/tmp/ansible_test_ptf_download_req_{{ ansible_date_time.epoch }}"

    - name: PTC04 download PTF with requisites
      ibm.power_ibmi.ibmi_download_fix_from_cloud:
        ptf_id: "{{ test_ptf_id }}"
        credentials: "{{ test_credentials }}"
        operation: "download"
        directory: "{{ test_download_dir_req }}"
        include_requisites: true
        clean_directory: true
      register: download_req_result
      delegate_to: localhost

    - name: PTC04 assert download with requisites succeeded
      ansible.builtin.assert:
        that:
          - download_req_result is defined
          - download_req_result.rc == 0
          - download_req_result.entitlement_verified == true
          - download_req_result.download_list is defined
          - download_req_result.download_list | length >= 1
        fail_msg: "Download with requisites failed"
        success_msg: "Download with requisites succeeded"

    - name: PTC04 display download with requisites results
      ansible.builtin.debug:
        var: download_req_result

  always:
    - name: PTC04 clean up downloaded files
      ansible.builtin.file:
        path: "{{ test_download_dir_req }}"
        state: absent
      delegate_to: localhost
      failed_when: false

# ─── PTC05 ────────────────────────────────────────────────────────────────────
- name: PTC05 - Download to existing directory without clean
  when: (tc_execute is not defined or 'PTC05' in tc_execute) and 'PTC05' not in (tc_skip | default([]))
  block:
    - name: PTC05 create pre-existing test directory
      ansible.builtin.file:
        path: "{{ test_download_dir }}_existing"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: PTC05 create a dummy file in the directory
      ansible.builtin.copy:
        content: "test content"
        dest: "{{ test_download_dir }}_existing/dummy.txt"
        mode: "0644"
      delegate_to: localhost

    - name: PTC05 download PTF to existing directory without clean
      ibm.power_ibmi.ibmi_download_fix_from_cloud:
        ptf_id: "{{ test_ptf_id }}"
        credentials: "{{ test_credentials }}"
        operation: "download"
        directory: "{{ test_download_dir }}_existing"
        include_requisites: false
        clean_directory: false
      register: download_existing_result
      delegate_to: localhost

    - name: PTC05 assert download to existing directory succeeded
      ansible.builtin.assert:
        that:
          - download_existing_result is defined
          - download_existing_result.rc == 0
          - download_existing_result.download_list is defined
        fail_msg: "Download to existing directory failed"
        success_msg: "Download to existing directory succeeded"

    - name: PTC05 verify dummy file was not deleted
      ansible.builtin.stat:
        path: "{{ test_download_dir }}_existing/dummy.txt"
      register: dummy_stat
      delegate_to: localhost

    - name: PTC05 assert dummy file was preserved
      ansible.builtin.assert:
        that:
          - dummy_stat.stat.exists
        fail_msg: "Dummy file was incorrectly deleted"
        success_msg: "Dummy file preserved as expected"

  always:
    - name: PTC05 clean up test directory
      ansible.builtin.file:
        path: "{{ test_download_dir }}_existing"
        state: absent
      delegate_to: localhost
      failed_when: false

# ─── PTC06 ────────────────────────────────────────────────────────────────────
- name: PTC06 - Download with clean_directory=true (old files deleted)
  when: (tc_execute is not defined or 'PTC06' in tc_execute) and 'PTC06' not in (tc_skip | default([]))
  block:
    - name: PTC06 create test directory with existing content
      ansible.builtin.file:
        path: "{{ test_download_dir }}_clean"
        state: directory
        mode: "0755"
      delegate_to: localhost

    - name: PTC06 create a dummy file to be cleaned
      ansible.builtin.copy:
        content: "test content to be cleaned"
        dest: "{{ test_download_dir }}_clean/to_be_deleted.txt"
        mode: "0644"
      delegate_to: localhost

    - name: PTC06 download PTF with clean_directory=true
      ibm.power_ibmi.ibmi_download_fix_from_cloud:
        ptf_id: "{{ test_ptf_id }}"
        credentials: "{{ test_credentials }}"
        operation: "download"
        directory: "{{ test_download_dir }}_clean"
        include_requisites: false
        clean_directory: true
      register: download_clean_result
      delegate_to: localhost

    - name: PTC06 assert download with clean succeeded
      ansible.builtin.assert:
        that:
          - download_clean_result is defined
          - download_clean_result.rc == 0
          - download_clean_result.download_list is defined
        fail_msg: "Download with clean_directory failed"
        success_msg: "Download with clean_directory succeeded"

    - name: PTC06 verify old dummy file was deleted
      ansible.builtin.stat:
        path: "{{ test_download_dir }}_clean/to_be_deleted.txt"
      register: deleted_stat
      delegate_to: localhost

    - name: PTC06 assert dummy file was deleted by clean
      ansible.builtin.assert:
        that:
          - not deleted_stat.stat.exists
        fail_msg: "Dummy file was not deleted as expected"
        success_msg: "Dummy file was deleted as expected"

  always:
    - name: PTC06 clean up test directory
      ansible.builtin.file:
        path: "{{ test_download_dir }}_clean"
        state: absent
      delegate_to: localhost
      failed_when: false
