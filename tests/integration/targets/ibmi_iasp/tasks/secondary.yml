# ── Part 1: verify the async submission path ──────────────────────────────────
# Submit via SBMJOB (synchronous:false).  The module should return rc=0
# immediately with CPC1221 in stdout.  The batch job will create the IASP
# when host services are active (QUSRWRK / QBATCH).

# Wait until disk_list[0] is confirmed non-configured before submitting.
# primary.yml deleted ANSIIASP1 synchronously; CFGDEVASP's underlying
# disk-release may not be instant, so we gate here.
- name: wait until disk_list[0] is non-configured before async create
  ibmi_get_nonconfigure_disks:
  register: pre_create_disk_result
  failed_when: false
  until: disk_list[0] in pre_create_disk_result['disks'].split(' ')
  retries: 20
  delay: 30

- name: create primary iasp asynchronously via SBMJOB
  ibmi_iasp:
    name: '{{new_iasp[0]}}'
    operation: 'create'
    asp_type: '*PRIMARY'
    primary_asp: 'abc'
    disks: '{{disk_list[0]}}'
    synchronous: false
  register: iasp_async_result

- name: debug - show submitted job info from async create
  debug:
    msg:
      - "SBMJOB cmd:    {{ iasp_async_result.cmd }}"
      - "SBMJOB stdout: {{ iasp_async_result.stdout }}"
      - "rc:            {{ iasp_async_result.rc }}"

- name: assert async create returns rc=0 and contains CPC1221 in stdout
  assert:
    that:
      - iasp_async_result.rc == 0
      - "'CPC1221' in iasp_async_result.stdout"
      - "'submitted' in iasp_async_result.stdout"
      - "'CFGDEVASP' in iasp_async_result.cmd"
      - "'SBMJOB' in iasp_async_result.cmd"
    fail_msg: >-
      async create did not return expected SBMJOB submission output.
      rc={{ iasp_async_result.rc }}, stdout={{ iasp_async_result.stdout }},
      cmd={{ iasp_async_result.cmd }}

# ── Part 2: wait for the async batch job to finish creating the primary IASP ──
# Poll display until asp_info is non-empty (IASP created) or we exhaust
# retries.  The batch job runs CFGDEVASP which takes ~30 s on average.
- name: wait for async batch job to create primary iasp
  ibmi_iasp:
    name: '{{new_iasp[0]}}'
    operation: 'display'
  register: iasp_display_result
  failed_when: false
  until: iasp_display_result.rc == 0 and iasp_display_result.asp_info | length > 0
  retries: 40
  delay: 30

- name: display the primary iasp info
  ibmi_iasp:
    name: '{{new_iasp[0]}}'
    operation: 'display'
  register: iasp_result

- name: assert primary iasp exists
  assert:
    that:
      - iasp_result.rc == 0
      - iasp_result.asp_info | length == 1
      - iasp_result.asp_info[0]['ASP_TYPE'] == 'PRIMARY'
      - iasp_result.asp_info[0]['RESOURCE_NAME'] == new_iasp[0]

# ── Part 3: secondary IASP tests ──────────────────────────────────────────────
- name: create an secondary iasp
  ibmi_iasp:
    name: '{{new_iasp[1]}}'
    operation: 'create'
    asp_type: '*SECONDARY'
    primary_asp: '{{new_iasp[0]}}'
    disks: '{{disk_list[1:3]}}'
  register: iasp_result

- name: display the iasp info
  ibmi_iasp:
    name: '{{new_iasp[0]}}'
    operation: 'display'
  register: iasp_result

- name: display the iasp info
  ibmi_iasp:
    name: '{{new_iasp[1]}}'
    operation: 'display'
  register: iasp_result

- name: assert the returned parameters
  assert:
    that:
      - iasp_result.asp_info | length == 1
      - iasp_result.asp_info[0]['ASP_TYPE'] == 'SECONDARY'
      - iasp_result.asp_info[0]['RESOURCE_NAME'] == new_iasp[1]
      - iasp_result.asp_info[0]['NUMBER_OF_DISK_UNITS'] | int == 2

- name: query non-configured disks
  ibmi_get_nonconfigure_disks:
  register: disk_result

- name: assert the returned parameters
  assert:
    that:
      - disk_result['disks'].split(' ') | length == disk_list | length - 3

- name: add disk to the iasp info
  ibmi_iasp:
    name: '{{new_iasp[1]}}'
    operation: 'add_disks'
    disks: '{{disk_list[3]}}'
  register: iasp_result

- name: display the iasp info
  ibmi_iasp:
    name: '{{new_iasp[1]}}'
    operation: 'display'
  register: iasp_result
  ignore_errors: true

- name: assert the returned parameters
  assert:
    that: 
      - iasp_result.asp_info[0]['NUMBER_OF_DISK_UNITS'] | int == 3

- name: query non-configured disks
  ibmi_get_nonconfigure_disks:
  register: disk_result

- name: assert the returned parameters (all disks are configured, no unconfigured disks)
  assert:
    that:
      - disk_result['disks'] | length == 0

- name: vary on the iasp
  ibmi_device_vary:
    device_list: '{{new_iasp[0]}}'
    status: '*ON'

- name: vary on the iasp
  ibmi_device_vary:
    device_list: '{{new_iasp[1]}}'
    status: '*ON'

- name: vary off the iasp
  ibmi_device_vary:
    device_list: '{{new_iasp[1]}}'
    status: '*OFF'

- name: vary off the iasp
  ibmi_device_vary:
    device_list: '{{new_iasp[0]}}'
    status: '*OFF'

- name: delete iasp 
  ibmi_iasp:
    name: '{{new_iasp[1]}}'
    operation: 'delete'
  register: iasp_result
  ignore_errors: true

- name: delete iasp 
  ibmi_iasp:
    name: '{{new_iasp[0]}}'
    operation: 'delete'
  register: iasp_result
  ignore_errors: true

- name: query non-configured disks
  ibmi_get_nonconfigure_disks:
  register: disk_result

- name: assert the returned parameters
  assert:
    that:
      - disk_result['disks'].split(' ') | length == disk_list | length
