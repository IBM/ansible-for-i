#
# Execute/skip list usage:
#   tc_execute: optional list of TC IDs to run  (e.g. ['NEG_TC17','NEG_TC25'])
#   tc_skip:    optional list of TC IDs to skip
#   If neither variable is defined, all TCs run (default behaviour).
#
# TC descriptions:
#   NEG_TC17  Run without options; expect "one of the following is required".
#   NEG_TC18  Create IFC (setup for following negative tests).
#   NEG_TC19  Create IFC without internet_address; expect "Parameter internet_address is not specified".
#   NEG_TC20  Create the same IFC again (duplicate); ignore_errors.
#   NEG_TC21  Change IFC with mismatched alias_name and internet_address; ignore_errors.
#   NEG_TC22  Query IFC with invalid alias_name; expect empty result.
#   NEG_TC23  Query IFC with invalid internet_address; expect empty result.
#   NEG_TC24  Change non-existing IFC (no internet_address); expect "Parameter internet_address is not specified".
#   NEG_TC25  Start IFC with mismatched alias_name/internet_address; expect TCP1B13 in job_log.
#   NEG_TC26  Start IFC with mismatched alias_name/internet_address (reversed); ignore_errors.
#   NEG_TC27  Start IFC with invalid alias_name; expect TCP1B26 in job_log.
#   NEG_TC28  Start IFC with invalid internet_address; expect TCP1B13 in job_log.
#   NEG_TC29  End IFC with mismatched alias_name/internet_address (both variants); ignore_errors.
#   NEG_TC30  End IFC with invalid alias_name; expect TCP2686 in job_log.
#   NEG_TC31  End IFC with invalid internet_address; ignore_errors.
#   NEG_TC32  Remove IFC with mismatched alias_name/internet_address; assert interface_info empty.
#   NEG_TC33  Remove IFC with mismatched alias_name/internet_address (reversed); ignore_errors.
#   NEG_TC34  Remove IFC with invalid internet_address; assert interface_info empty.
#

# ─── NEG_TC17 - Run without options ───────────────────────────────────────────
- name: NEG_TC17 - run without options
  when: (tc_execute is not defined or 'NEG_TC17' in tc_execute) and 'NEG_TC17' not in (tc_skip | default([]))
  block:
    - name: NEG_TC17 - run without options
      ibmi_tcp_interface:
      register: tcp_result
      failed_when: "'one of the following is required: internet_address, alias_name' not in tcp_result.msg"

# ─── NEG_TC18 - Create IFC (setup for subsequent negative tests) ──────────────
- name: NEG_TC18 - create IFC setup
  when: (tc_execute is not defined or 'NEG_TC18' in tc_execute) and 'NEG_TC18' not in (tc_skip | default([]))
  block:
    - name: NEG_TC18 - create a new IFC
      ibmi_tcp_interface:
        line_description: '{{lind_name}}'
        subnet_mask: '{{subnet}}'
        alias_name: '{{ifc_name}}'
        internet_address: '{{ifc_ip}}'

# ─── NEG_TC19 - Create IFC without internet_address ──────────────────────────
- name: NEG_TC19 - create IFC without internet_address
  when: (tc_execute is not defined or 'NEG_TC19' in tc_execute) and 'NEG_TC19' not in (tc_skip | default([]))
  block:
    - name: NEG_TC19 - create a new IFC without internet_address
      ibmi_tcp_interface:
        line_description: '{{lind_name}}'
        subnet_mask: '{{subnet}}'
        alias_name: '{{ifc_name}}'
      register: tcp_result
      ignore_errors: true

    - name: NEG_TC19 - assert error message
      assert:
        that:
          - "'Parameter internet_address is not specified' in tcp_result.msg"

